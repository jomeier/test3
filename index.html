<!doctype html>
<!--
  Purpose: Host the WebGL jump-and-run game: a full-screen canvas plus a small
  HTML HUD that shows score, lives, seed and the controls.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocky Jump &amp; Run - WebGL</title>
    <style>
      :root {
        --panel: rgba(12, 18, 30, 0.72);
        --text: #e8f1f5;
        --accent: #7fd7a6;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #101725;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.3;
      }

      #hud b {
        color: var(--accent);
      }

      #help {
        position: fixed;
        right: 12px;
        top: 12px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 12px;
        max-width: 260px;
      }

      #help kbd {
        background: #2c3a4d;
        border-radius: 4px;
        padding: 2px 6px;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 20, 0.55);
        color: var(--text);
        font-size: 22px;
        text-align: center;
      }

      #overlay.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" role="img" aria-label="Jump and run game rendered with WebGL"></canvas>

    <div id="hud">
      <span>Score <b id="score">0</b></span>
      <span>Lives <b id="lives">3</b></span>
      <span>Stomped enemies <b id="enemies">0</b></span>
      <span>Distance <b id="distance">0</b></span>
      <span>Seed <b id="seed">1234</b></span>
      <span id="status">starting…</span>
    </div>

    <div id="help">
      <kbd>A</kbd> / <kbd>D</kbd> run &nbsp; <kbd>Space</kbd> or <kbd>W</kbd> jump &nbsp;
      <kbd>S</kbd> fast-fall &nbsp; <kbd>R</kbd> new world
    </div>

    <div id="overlay" class="hidden"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
