<!doctype html>
<!--
  Purpose: Host the WebGL jump-and-run game: a full-screen canvas plus a small
  HTML HUD that shows score, lives, seed and the controls.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocky Jump &amp; Run - WebGL</title>
    <style>
      :root {
        --panel: rgba(12, 18, 30, 0.72);
        --text: #e8f1f5;
        --accent: #7fd7a6;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #101725;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.3;
      }

      #hud b {
        color: var(--accent);
      }

      .alert {
        color: #ff7a5c;
        font-weight: 600;
      }

      #help {
        position: fixed;
        right: 12px;
        top: 12px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 12px;
        max-width: 260px;
      }

      #help kbd {
        background: #2c3a4d;
        border-radius: 4px;
        padding: 2px 6px;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 20, 0.55);
        color: var(--text);
        font-size: 22px;
        text-align: center;
      }

      #overlay.hidden {
        display: none;
      }

      #credits {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: rgba(232, 241, 245, 0.55);
        font-size: 11px;

    <div id="hud">
      <span>Score <b id="score">0</b></span>

    <script>
/* ---- src/prng.js ---- */
// Purpose: Provide a deterministic, seedable pseudo-random generator so the
// procedural world is reproducible: the same seed always builds the same level.

/**
 * Create a seeded random generator (mulberry32).
 * Returns a function that yields floats in [0, 1).
 */
function makeRng(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Return a random float in [min, max). */
function range(rng, min, max) {
  return min + rng() * (max - min);
}

/** Return a random integer in [min, max] inclusive. */
function int(rng, min, max) {
  return Math.floor(min + rng() * (max - min + 1));
}

/** Return one random element from an array. */
function pick(rng, items) {
  return items[Math.floor(rng() * items.length)];
}

/** Keep a number inside [min, max]. */
function clamp(value, min, max) {
  return value < min ? min : value > max ? max : value;
}

/**
 * Return a deterministic float in [0, 1) from two integers.
 * Used for detail patterns (bricks, windows) without storing extra data.
 */
function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0;
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
}

/* ---- src/world.js ---- */
// Purpose: Generate the jump-and-run world procedurally in chunks (platforms,
// patrolling enemies, scenery and a parallax city skyline) so the level grows
// endlessly to the right and is reproducible from one seed.
// Every generation value is a named constant here; the reason for each value is
// written down in agent-memory/design-guidelines/world-generation.md.
// Pure data in, data out, so the generator is testable without a browser.



// Shape of the level. Tests import the first three.
const MIN_PLATFORM_WIDTH = 3.2;
const MAX_GAP = 3.4; // gap before a flat step or a drop
const START_TOP = 2; // walkable surface of the first platform
const MAX_PLATFORM_WIDTH = 9;
const MIN_GAP = 1.2;
const MAX_GAP_BEFORE_CLIMB = 2.4; // climbing is harder than jumping across
const MIN_TOP = -6; // clamped so the level never drifts out of view
const MAX_TOP = 18;
const RISE_CHANCE = 0.45; // most steps go up, drops are the exception
const MAX_RISE = 2; // a small upward step is always reachable
const MAX_DROP = 3; // a bigger drop gives the player room to fall
const GROUND_CHANCE = 0.55; // ground is the dominant kind
const GROUND_HEIGHT = 3; // thick, green, walkable
const FLOAT_HEIGHT = 1; // thin, warm planks, reads as a light platform

// The first chunk is placed by hand: a wide safe strip to land on and a tall
// pillar on the left edge that stops the player from running into the void.
const SAFE_STRIP_X = -2;
const SAFE_STRIP_WIDTH = 12;
const SAFE_STRIP_HEIGHT = 2;
const LEFT_PILLAR = { x: -3.5, top: 12, w: 1.5, h: 20 };
const SPAWN_X = 2;
const START_FRONTIER_X = 10; // first platform that is generated, not placed
const INITIAL_WORLD_X = 120; // how much of the level exists from the start

// Scenery. Bushes are listed twice so greenery is the dominant impression.
const DECOR_TYPES = ["bush", "bush", "tree", "flower", "rock", "lamp"];
const DECOR_SIZES = [0.6, 0.9, 1.2];
const DECOR_EDGE_MARGIN = 0.3;
const EXTRA_DECOR_CHANCE = 0.35; // a second prop on the same platform
const DECOR_HEIGHT_FACTORS = { tree: 2.2, lamp: 2.4, bush: 1.2 };

// Enemies. A patrolling enemy needs room, otherwise it always stands in a
// corner and cannot be passed fairly.
const ENEMY_MIN_WIDTH = 4.5;
const ENEMY_CHANCE = 0.5;
const ENEMY_EDGE_MARGIN = 0.4;
const ENEMY_SIZE = 1.2;
const ENEMY_SPEED_MIN = 1.2;
const ENEMY_SPEED_MAX = 3.0;

// Background hills, seen between the city layers.
const HILL_CHANCE = 0.4;
const HILL_BACK = [2, 8]; // hills sit behind the platform they belong to
const HILL_BASE_DROP = 10; // their base stays below the platform top
const HILL_WIDTH = [10, 26];
const HILL_HEIGHT = [5, 12];

// Background city: layer 0 is the far skyline (generated almost every chunk so
// it reads as one continuous city), layer 1 is the nearer and sparser one.
const CITY_LAYERS = [
  { layer: 0, chance: 0.9, back: [2, 14], baseDrop: 12, width: [5, 16], height: [6, 20] },
  { layer: 1, chance: 0.6, back: [1, 9], baseDrop: 8, width: [4, 11], height: [3, 12] },
];

// Falling out of the level must end the run, but the line has to follow the
// generated world so a deep chunk is not instantly lethal.
const DEATH_DROP = 12;

/**
 * Create a new world for a seed.
 * Always starts with a safe ground strip and a wall on the left edge.
 */
function createWorld(seed) {
  const world = {
    seed: seed >>> 0,
    rng: makeRng(seed),
    platforms: [],
    enemies: [],
    decor: [],
    hills: [],
    buildings: [],
    nextX: 0, // right frontier of the generated level
    top: START_TOP, // surface height of the last platform
    lowestTop: START_TOP, // deepest surface seen so far
    spawn: { x: SPAWN_X, y: START_TOP },
  };

  addPlatform(world, SAFE_STRIP_X, START_TOP, SAFE_STRIP_WIDTH, SAFE_STRIP_HEIGHT, "ground");
  addPlatform(world, LEFT_PILLAR.x, LEFT_PILLAR.top, LEFT_PILLAR.w, LEFT_PILLAR.h, "wall");
  world.nextX = START_FRONTIER_X;
  ensureWorld(world, INITIAL_WORLD_X);
  return world;
}

/** Generate chunks until the world covers everything left of `upToX`. */
function ensureWorld(world, upToX) {
  while (world.nextX < upToX) generateChunk(world);
}

/**
 * Add one platform at the right frontier of the world, plus optional
 * decoration, an enemy, a background hill and city buildings.
 * The order of the random rolls is fixed: the seed must always build the same
 * level, so a value may never be rolled conditionally unless the skip is part
 * of the design (see the enemy check below).
 */
function generateChunk(world) {
  const rng = world.rng;

  // Height change: mostly a small step up, otherwise a bigger drop.
  const delta = rng() < RISE_CHANCE ? int(rng, 0, MAX_RISE) : -int(rng, 0, MAX_DROP);
  const gap = range(rng, MIN_GAP, delta > 0 ? MAX_GAP_BEFORE_CLIMB : MAX_GAP);
  const x = world.nextX + gap;
  const top = clamp(world.top + delta, MIN_TOP, MAX_TOP);
  const w = range(rng, MIN_PLATFORM_WIDTH, MAX_PLATFORM_WIDTH);
  const kind = rng() < GROUND_CHANCE ? "ground" : "float";
  const h = kind === "ground" ? GROUND_HEIGHT : FLOAT_HEIGHT;

  const plat = addPlatform(world, x, top, w, h, kind);
  world.top = top;
  world.lowestTop = Math.min(world.lowestTop, top);
  world.nextX = x + w;

  addDecor(world, plat);
  if (rng() < EXTRA_DECOR_CHANCE) addDecor(world, plat);

  if (w >= ENEMY_MIN_WIDTH && rng() < ENEMY_CHANCE) addEnemy(world, plat);

  if (rng() < HILL_CHANCE) addHill(world, x, top);

  addCity(world, x, top);
}

/**
 * Add a platform box. `top` is the walkable surface height.
 * Returns the created platform object.
 */
function addPlatform(world, x, top, w, h, kind) {
  const plat = { x, y: top - h, w, h, top, kind };
  world.platforms.push(plat);
  return plat;
}

/** Add scenery (bush, tree, flower, rock or street lamp) sitting on a platform. */
function addDecor(world, plat) {
  const rng = world.rng;
  const type = pick(rng, DECOR_TYPES);
  const size = pick(rng, DECOR_SIZES);
  const h = size * (DECOR_HEIGHT_FACTORS[type] ?? 1);

  world.decor.push({
    type,
    x: plat.x + range(rng, DECOR_EDGE_MARGIN, Math.max(DECOR_EDGE_MARGIN, plat.w - size - DECOR_EDGE_MARGIN)),
    y: plat.top,
    w: size,
    h,
  });
}

/** Add an enemy that patrols back and forth on a platform. */
function addEnemy(world, plat) {
  const rng = world.rng;
  const left = plat.x + ENEMY_EDGE_MARGIN;
  const right = plat.x + plat.w - ENEMY_EDGE_MARGIN - ENEMY_SIZE;
  if (right <= left) return;

  world.enemies.push({
    x: range(rng, left, right),
    y: plat.top,
    w: ENEMY_SIZE,
    h: ENEMY_SIZE,
    left,
    right,
    dir: rng() < 0.5 ? -1 : 1,
    speed: range(rng, ENEMY_SPEED_MIN, ENEMY_SPEED_MAX),
    alive: true,
    squash: 0,
  });
}

/** Add a background hill behind the platform that was just generated. */
function addHill(world, x, top) {
  const rng = world.rng;
  world.hills.push({
    x: x - range(rng, ...HILL_BACK),
    y: top - HILL_BASE_DROP,
    w: range(rng, ...HILL_WIDTH),
    h: range(rng, ...HILL_HEIGHT),
  });
}

/**
 * Add city buildings for the parallax background, one roll per layer.
 * The ids are numbered from the first building of this chunk so the window
 * pattern of a tower stays stable for the seed.
 */
function addCity(world, x, top) {
  const rng = world.rng;
  const firstId = world.buildings.length;

  for (const [index, layer] of CITY_LAYERS.entries()) {
    if (rng() >= layer.chance) continue;

    world.buildings.push({
      layer: layer.layer,
      id: firstId + index,
      x: x - range(rng, ...layer.back),
      y: top - layer.baseDrop,
      w: range(rng, ...layer.width),
      h: range(rng, ...layer.height),
    });
  }
}

/** Y below which the player falls to their death. */
function deathY(world) {
  return world.lowestTop - DEATH_DROP;
}

/* ---- src/physics.js ---- */
// Purpose: Run the game physics - player gravity, jumping, platform collision
// and the enemy patrol movement - independent of rendering.
// Every tuning value is a named constant here, so the game feel can be changed
// in one place without touching the maths.

// Core movement tuning.
const GRAVITY = 34; // downward acceleration, world units per second^2
const JUMP_VELOCITY = 12; // starting speed of a full jump
const RUN_SPEED = 8.5; // top horizontal speed while running
const ACCEL = 70; // how fast the player reaches RUN_SPEED
const MAX_FALL = 28; // terminal falling speed
const COYOTE_TIME = 0.1; // seconds a jump is still allowed after leaving a ledge
const JUMP_BUFFER = 0.12; // seconds an early jump key press is remembered

// Smaller tuning details.
const AIR_DRAG = 14; // slows the player down when no key is held
const STOP_VELOCITY = 0.05; // below this the player is considered standing still
const FAST_FALL_ACCEL = 24; // extra downward pull while the down key is held
const SHORT_HOP_FACTOR = 0.4; // jump is cut to this speed when the key is released
const STOMP_BOUNCE_FACTOR = 0.7; // bounce after stomping an enemy, of JUMP_VELOCITY
const STOMP_MIN_FEET_FACTOR = 0.4; // part of the enemy height the feet must be above
const DEFEAT_SQUASH_RATE = 4; // per second: how fast a squashed enemy flattens
const PLAYER_WIDTH = 1.1;
const PLAYER_HEIGHT = 1.5;

// Collision tolerances: without them a box that exactly touches a platform edge
// would be treated as an overlap and the player would catch on every seam.
const SIDE_TOUCH_EPSILON = 1e-4;
const LANDING_EPSILON = 1e-3;

/** Return true when two axis-aligned boxes overlap. */
function intersects(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/** Create the player box at a spawn position. */
function createPlayer(x, y) {
  return {
    x,
    y,
    w: PLAYER_WIDTH,
    h: PLAYER_HEIGHT,
    vx: 0,
    vy: 0,
    onGround: false,
    coyote: 0,
    jumpBuffer: 0,
    jumps: 0,
    face: 1,
  };
}

/**
 * Advance the player by dt seconds.
 * `input` is { left, right, jump, down } and returns the player object.
 */
function stepPlayer(p, platforms, dt, input) {
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);

  if (dir !== 0) {
    p.vx += dir * ACCEL * dt;
    if (p.vx > RUN_SPEED) p.vx = RUN_SPEED;
    if (p.vx < -RUN_SPEED) p.vx = -RUN_SPEED;
    p.face = dir;
  } else {
    p.vx *= Math.max(0, 1 - AIR_DRAG * dt);
    if (Math.abs(p.vx) < STOP_VELOCITY) p.vx = 0;
  }

  // Jump with input buffering and coyote time, and shorter hops when the
  // jump key is released early (variable jump height).
  p.jumpBuffer = input.jump ? JUMP_BUFFER : Math.max(0, p.jumpBuffer - dt);
  p.coyote = p.onGround ? COYOTE_TIME : Math.max(0, p.coyote - dt);

  if (p.jumpBuffer > 0 && (p.onGround || p.coyote > 0)) {
    p.vy = JUMP_VELOCITY;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
    p.jumps += 1;
  } else if (!input.jump && p.vy > JUMP_VELOCITY * SHORT_HOP_FACTOR) {
    p.vy = JUMP_VELOCITY * SHORT_HOP_FACTOR;
  }

  p.vy = Math.max(p.vy - GRAVITY * dt, -MAX_FALL);

  // Horizontal move, then push out of any platform side we entered.
  p.x += p.vx * dt;
  for (const plat of platforms) {
    if (!intersects(p, plat)) continue;
    if (p.vx > 0) p.x = plat.x - p.w;
    else if (p.vx < 0) p.x = plat.x + plat.w;
  }

  // Vertical move, then land on top of a platform or bump the head.
  const prevBottom = p.y;
  const prevTop = p.y + p.h;
  p.y += p.vy * dt;
  p.onGround = false;

  for (const plat of platforms) {
    if (p.x + p.w <= plat.x + SIDE_TOUCH_EPSILON || p.x >= plat.x + plat.w - SIDE_TOUCH_EPSILON) continue;

    if (p.vy <= 0 && prevBottom >= plat.top - LANDING_EPSILON && p.y < plat.top) {
      p.y = plat.top;
      p.vy = 0;
      p.onGround = true;
    } else if (p.vy > 0 && prevTop <= plat.y + LANDING_EPSILON && p.y + p.h > plat.y) {
      p.y = plat.y - p.h;
      p.vy = 0;
    }
  }

  // The down key makes the player drop faster. It is applied after the move so
  // the extra speed only takes effect in the next step, exactly as before.
  if (input.down && !p.onGround) p.vy -= FAST_FALL_ACCEL * dt;

  return p;
}

/** Move a patrolling enemy, turning around at the edges of its platform. */
function stepEnemy(e, dt) {
  if (!e.alive) {
    e.squash = Math.min(1, e.squash + dt * DEFEAT_SQUASH_RATE);
    return;
  }

  e.x += e.dir * e.speed * dt;
  if (e.x <= e.left) {
    e.x = e.left;
    e.dir = 1;
  }
  if (e.x >= e.right) {
    e.x = e.right;
    e.dir = -1;
  }
}

/**
 * Resolve player vs enemy contact.
 * Returns "stomp" when the player lands on the enemy, "hit" when the player
 * touches it from the side, otherwise null.
 */
function playerEnemyCollision(p, enemies) {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!intersects(p, e)) continue;

    const feetAboveMiddle = p.y > e.y + e.h * STOMP_MIN_FEET_FACTOR;
    if (p.vy <= 0 && feetAboveMiddle) {
      e.alive = false;
      p.y = e.y + e.h;
      p.vy = JUMP_VELOCITY * STOMP_BOUNCE_FACTOR;
      return "stomp";
    }
    return "hit";
  }
  return null;
}

/* ---- src/camera.js ---- */
// Purpose: Turn the world coordinates of the camera into WebGL clip space
// coordinates, keep the camera smoothly following the player and provide the
// shared "how far below the visible area" helper the background layers use.

const VIEW_HEIGHT = 18; // world units visible vertically

// Default distance of a background base line below the bottom edge of the view.
// Towers and hills are drawn down to this line so they run off the screen
// instead of ending in mid-air.
const OFFSCREEN_MARGIN = 40;

// Damping of the camera follow: a larger value snaps the camera harder.
const CAMERA_SMOOTHING = 6;

// How far the camera looks ahead of the player.
const CAMERA_LEAD_X = 4;
const CAMERA_LEAD_Y = 5;

// A new run starts with a wider lead so the player already sees the next
// platforms when the first frame is drawn.
const START_CAMERA_LEAD_X = 6;

/** Compute the visible world width/height for a given canvas aspect ratio. */
function computeView(aspect, height = VIEW_HEIGHT) {
  return { w: height * aspect, h: height };
}

/** Create a camera centred on the player. */
function createCamera(x, y) {
  return { x, y };
}

/** Move the camera towards a target, with a critically damped follow. */
function followCamera(cam, targetX, targetY, dt) {
  const blend = 1 - Math.exp(-CAMERA_SMOOTHING * dt);
  cam.x += (targetX - cam.x) * blend;
  cam.y += (targetY - cam.y) * blend;
  return cam;
}

/**
 * Convert a world point to WebGL clip space (-1..1) for the given camera
 * and view size. Used by the WebGL renderer for every quad vertex.
 */
function worldToClip(x, y, cam, view) {
  return [((x - cam.x) * 2) / view.w, ((y - cam.y) * 2) / view.h];
}

/** Return true when a box is at least partly inside the camera view. */
function inView(box, cam, view) {
  const left = cam.x - view.w / 2;
  const right = cam.x + view.w / 2;
  const bottom = cam.y - view.h / 2;
  const top = cam.y + view.h / 2;
  return box.x < right && box.x + box.w > left && box.y < top && box.y + box.h > bottom;
}

/**
 * World y that lies `margin` units below the bottom edge of the current view.
 * Background layers use it as their ground line, so every tower reaches past
 * the bottom of the screen for any camera position.
 */
function belowBottom(cam, view, margin = OFFSCREEN_MARGIN) {
  return cam.y - view.h / 2 - margin;
}

/* ---- src/jets.js ---- */
// Purpose: Handle the jet fighters that cross the sky every few seconds and
// drop a bomb over the player - spawning, the drop, the fall and the explosion
// when a bomb hits solid ground. Pure maths, so it can be tested without a
// browser.




const FIRST_JET = 4; // seconds before the first jet appears
const JET_MIN_GAP = 4; // shortest pause between two jets
const JET_MAX_GAP = 8; // longest pause between two jets
const JET_HEIGHT = 9; // flying height above the player
const JET_SPAWN_DISTANCE = 20; // how far off screen a jet enters
const JET_SPEED_MIN = 13; // slowest jet crossing the sky
const JET_SPEED_MAX = 18; // fastest jet crossing the sky
const JET_W = 3.4;
const JET_H = 1.1;
const JET_CULL_DISTANCE = 45; // jets farther away than this are dropped
const BOMB_WARNING = 1.5; // seconds between the drop and the impact
const BOMB_W = 0.55;
const BOMB_H = 0.8;
const DROP_ALIGN_TOLERANCE = 0.9; // how exactly the jet must be over the player
const BLAST_RADIUS = 3.2; // how far the explosion reaches
const BLAST_DURATION = 0.6; // how long the fireball is drawn
const MIN_DROP = 4; // smallest distance a bomb is made to fall
const VOID_MARGIN = 30; // below the deepest top a bomb is lost in the void

// The jet seed is mixed with a large odd prime so the world and the jets do not
// run on the same random stream.
const JET_SEED_MIX = 0x9e3779b9;

/** Create the threat state (jets, bombs, explosions) for one run. */
function createThreats(seed) {
  return {
    rng: makeRng((seed ^ JET_SEED_MIX) >>> 0),
    nextId: 0,
    nextJet: FIRST_JET,
    jets: [],
    bombs: [],
    blasts: [],
  };
}

/**
 * Highest platform surface directly below (x, fromY), or null when there is no
 * ground under that column - then the bomb falls into the void.
 */
function surfaceBelow(world, x, fromY) {
  let best = null;
  for (const plat of world.platforms) {
    if (x < plat.x || x > plat.x + plat.w) continue;
    if (plat.top >= fromY) continue;
    if (best === null || plat.top > best) best = plat.top;
  }
  return best;
}

/**
 * Advance jets, bombs and explosions by dt seconds.
 * Returns events so the caller can react: jetSpawned, bombDropped, exploded,
 * playerHit, enemiesKilled.
 */
function stepThreats(threats, world, player, dt, time) {
  const events = {
    jetSpawned: false,
    bombDropped: false,
    exploded: 0,
    playerHit: false,
    enemiesKilled: 0,
  };

  // A new jet appears every few seconds, from the left or from the right.
  if (time >= threats.nextJet) {
    const dir = threats.rng() < 0.5 ? 1 : -1;
    threats.jets.push({
      id: threats.nextId++,
      x: player.x - dir * JET_SPAWN_DISTANCE,
      y: player.y + JET_HEIGHT,
      dir,
      speed: range(threats.rng, 13, 18),
      w: JET_W,
      h: JET_H,
      dropped: false,
    });
    threats.nextJet = time + range(threats.rng, JET_MIN_GAP, JET_MAX_GAP);
    events.jetSpawned = true;
  }

  for (const jet of threats.jets) {
    jet.x += jet.dir * jet.speed * dt;

    // The bomb is released the moment the jet is exactly above the player, so
    // the player can see it coming and has BOMB_WARNING seconds to escape.
    if (!jet.dropped) {
      const jetCenter = jet.x + jet.w / 2;
      const playerCenter = player.x + player.w / 2;
      if (Math.abs(jetCenter - playerCenter) < 0.9) {
        const targetY = surfaceBelow(world, jetCenter, jet.y);
        // The fall is measured from the jet, so it may pass through the player
        // or the decor on the way down; only the blast itself is dangerous.
        const drop = targetY === null ? MIN_DROP : jet.y - targetY;
        // Gravity is picked so the bomb reaches the ground after exactly
        // BOMB_WARNING seconds, which keeps the warning window predictable.
        // Very short drops use MIN_DROP so the bomb never floats unnaturally.
        threats.bombs.push({
          id: jet.id,
          x: jetCenter,
          y: jet.y,
          vy: 0,
          g: (2 * Math.max(MIN_DROP, drop)) / (BOMB_WARNING * BOMB_WARNING),
          targetY,
          w: 0.55,
          h: 0.8,
          droppedAt: time,
        });
        jet.dropped = true;
        events.bombDropped = true;
      }
    }
  }

  // Remove jets that have flown out of the world.
  threats.jets = threats.jets.filter((jet) => Math.abs(jet.x - player.x) < 45);

  // Bombs fall straight down and explode on the first solid surface.
  for (const bomb of threats.bombs) {
    bomb.vy -= bomb.g * dt;
    bomb.y += bomb.vy * dt;

    if (bomb.targetY !== null && bomb.y <= bomb.targetY) {
      bomb.y = bomb.targetY;
      explode(threats, world, player, bomb, time, events);
      bomb.dead = true;
    } else if (bomb.y < world.lowestTop - 30) {
      bomb.dead = true; // fell into the void without a blast
    }
  }
  threats.bombs = threats.bombs.filter((b) => !b.dead);

  // Explosions fade out after BLAST_DURATION seconds.
  threats.blasts = threats.blasts.filter((blast) => time - blast.start < blast.duration);

  return events;
}

/**
 * Create the fireball and damage everything inside the blast radius.
 * Exported so the tests can call it directly.
 */
function explode(threats, world, player, bomb, time, events) {
  threats.blasts.push({
    x: bomb.x,
    y: bomb.targetY,
    start: time,
    radius: BLAST_RADIUS,
    duration: BLAST_DURATION,
  });
  events.exploded += 1;

  const px = player.x + player.w / 2;
  const py = player.y + player.h / 2;
  if (distance(px, py, bomb.x, bomb.y) <= BLAST_RADIUS) events.playerHit = true;

  for (const enemy of world.enemies) {
    if (!enemy.alive) continue;
    if (distance(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, bomb.x, bomb.y) <= BLAST_RADIUS) {
      enemy.alive = false;
      enemy.squash = 1;
      events.enemiesKilled += 1;
    }
  }
}

/** Distance between two points. */
function distance(ax, ay, bx, by) {
  const dx = ax - bx;
  const dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

/* ---- src/moon.js ---- */
// Purpose: Compute where the moon sits in the sky. It rises on the left in an
// arc, stands still for a moment at the top centre, then sets on the right,
// and starts again. Pure maths, so the path can be tested without a browser.

const MOON_RISE = 10; // seconds to climb from the left horizon to the top
const MOON_HOLD = 3; // seconds the moon stays at the highest point
const MOON_SET = 10; // seconds to sink down to the right horizon
const MOON_CYCLE = MOON_RISE + MOON_HOLD + MOON_SET;

const MOON_RADIUS = 0.1; // half width of the disc in clip space (-1..1)

const HORIZON = -1.1; // clip-space height where the moon is fully off screen
const TOP = 0.72; // clip-space height at the highest point (below the HUD bar)
const LEFT = -1.2; // clip-space x of the rising moon
const RIGHT = 1.2; // clip-space x of the setting moon

/**
 * Position of the moon centre in clip space at a given time.
 * Returns { x, y, altitude, phase } with altitude 0 at the horizon and 1 at the
 * top, so the renderer can dim the moon near the horizon.
 */
function moonPosition(time) {
  const cycle = ((time % MOON_CYCLE) + MOON_CYCLE) % MOON_CYCLE;

  if (cycle < MOON_RISE) {
    // Rising: 2t - t^2 is steep at the start and flattens as it reaches the top.
    const t = cycle / MOON_RISE;
    const altitude = 2 * t - t * t;
    return { x: LEFT + (0 - LEFT) * t, y: HORIZON + (TOP - HORIZON) * altitude, altitude, phase: "rise" };
  }

  if (cycle < MOON_RISE + MOON_HOLD) {
    return { x: 0, y: TOP, altitude: 1, phase: "high" };
  }

  // Setting: mirror image of the rise, so the arc is symmetric.
  const t = (cycle - MOON_RISE - MOON_HOLD) / MOON_SET;
  const altitude = 1 - t * t;
  return { x: RIGHT * t, y: HORIZON + (TOP - HORIZON) * altitude, altitude, phase: "set" };
}

/**
 * Colour of the moon for a given altitude: warm and dim near the horizon,
 * bright and pale when it is high in the sky.
 */
function moonTint(altitude) {
  const t = Math.max(0, Math.min(1, altitude));
  return [0.62 + 0.38 * t, 0.52 + 0.44 * t, 0.42 + 0.52 * t];
}

/* ---- src/renderer.js ---- */
// Purpose: Render the game world with WebGL (raw WebGL 1, no libraries) by
// batching every visible box into a single triangle buffer per frame, add
// procedural detail (grass, mortar lines, windows, bushes) and draw the few
// real photo textures (moon, brick, wood) that src/textures.js loads.






// belowBottom owns the skyline base line. It stays reachable from this module
// because that is where the tests and the design notes look for it.
{ belowBottom };

const MAX_QUADS = 15000;
const FLOATS_PER_VERTEX = 6; // x, y, r, g, b, a

const MAX_TEX_QUADS = 4000;
const TEX_FLOATS_PER_VERTEX = 7; // x, y, u, v, r, g, b

const VERTEX_SOURCE = `
attribute vec2 pos;
attribute vec3 color;
attribute float alpha;
varying vec3 vcolor;
varying float valpha;
void main() {
  vcolor = color;
  valpha = alpha;
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

const FRAGMENT_SOURCE = `
precision mediump float;
varying vec3 vcolor;
varying float valpha;
void main() {
  gl_FragColor = vec4(vcolor, valpha);
}`;

const TEX_VERTEX_SOURCE = `
attribute vec2 pos;
attribute vec2 uv;
attribute vec3 color;
varying vec2 vuv;
varying vec3 vcolor;
void main() {
  vuv = uv;
  vcolor = color;
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

// A photo is multiplied into the flat game colour, so a texture never clashes
// with the palette. `disc` turns a quad into a circle with a soft edge.
const TEX_FRAGMENT_SOURCE = `
precision mediump float;
varying vec2 vuv;
varying vec3 vcolor;
uniform sampler2D tex;
uniform float disc;
void main() {
  vec4 photo = texture2D(tex, vuv);
  vec3 color = mix(photo.rgb, vcolor, 0.35);
  float mask = 1.0;
  if (disc > 0.5) {
    float d = distance(vuv, vec2(0.5, 0.5));
    mask = smoothstep(0.5, 0.42, d);
  }
  gl_FragColor = vec4(color, photo.a * mask);
}`;

/** Blend two rgb colors, t = 0 returns a, t = 1 returns b. */
function mix(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

/**
 * Texture coordinates for a world box.
 * `scale` is the number of world units one photo tile covers. The uv values may
 * only depend on the world position, never on the camera, otherwise the photo
 * slides over the platform every time the camera moves (for example when the
 * player jumps). World y grows upwards while row 0 of the image is at the top,
 * so v is negated.
 */
function textureUV(x, y, w, h, scale) {
  return {
    u1: x / scale,
    v1: -y / scale,
    u2: (x + w) / scale,
    v2: -(y + h) / scale,
  };
}

/**
 * Build the six vertices of one textured quad in clip space:
 * [x, y, u, v] per vertex, two triangles covering the box.
 * The clip positions follow the camera, the uv values follow the world only.
 */
function texturedQuad(x, y, w, h, cam, view, scale) {
  const uv = textureUV(x, y, w, h, scale);
  const x1 = ((x - cam.x) * 2) / view.w;
  const y1 = ((y - cam.y) * 2) / view.h;
  const x2 = ((x + w - cam.x) * 2) / view.w;
  const y2 = ((y + h - cam.y) * 2) / view.h;

  return [
    [x1, y1, uv.u1, uv.v1],
    [x2, y1, uv.u2, uv.v1],
    [x1, y2, uv.u1, uv.v2],
    [x1, y2, uv.u1, uv.v2],
    [x2, y1, uv.u2, uv.v1],
    [x2, y2, uv.u2, uv.v2],
  ];
}

/**
 * Create the WebGL renderer for a canvas.
 * Returns { resize, draw, setTextures, gl }.
 */
function createRenderer(canvas) {
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if (!gl) throw new Error("WebGL is not available in this browser.");

  const program = buildProgram(gl, VERTEX_SOURCE, FRAGMENT_SOURCE);
  gl.useProgram(program);
  const posLoc = gl.getAttribLocation(program, "pos");
  const colorLoc = gl.getAttribLocation(program, "color");
  const alphaLoc = gl.getAttribLocation(program, "alpha");

  const texProgram = buildProgram(gl, TEX_VERTEX_SOURCE, TEX_FRAGMENT_SOURCE);
  const texPosLoc = gl.getAttribLocation(texProgram, "pos");
  const texUvLoc = gl.getAttribLocation(texProgram, "uv");
  const texColorLoc = gl.getAttribLocation(texProgram, "color");
  const texSampler = gl.getUniformLocation(texProgram, "tex");
  const texDisc = gl.getUniformLocation(texProgram, "disc");

  // Overlapping quads (glow, clouds, the moon) blend instead of hiding each other.
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const data = new Float32Array(MAX_QUADS * 6 * FLOATS_PER_VERTEX);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

  const texData = new Float32Array(MAX_TEX_QUADS * 6 * TEX_FLOATS_PER_VERTEX);
  const texBuffer = gl.createBuffer();

  const textures = new Map(); // texture name -> WebGL texture
  let texName = null; // texture of the batch currently being collected
  let discMask = false; // the current textured batch is a circular disc

  let quads = 0;
  let count = 0; // number of floats written into `data`
  let texQuads = 0;
  let texCount = 0; // number of floats written into `texData`
  let drawnQuads = 0; // quads actually sent to the GPU this frame

  /** Upload and draw the flat quads collected so far. */
  function flushFlat() {
    if (quads === 0) return;

    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, data.subarray(0, count), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(posLoc);
    gl.enableVertexAttribArray(colorLoc);
    gl.enableVertexAttribArray(alphaLoc);
    gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, FLOATS_PER_VERTEX * 4, 0);
    gl.vertexAttribPointer(colorLoc, 3, gl.FLOAT, false, FLOATS_PER_VERTEX * 4, 2 * 4);
    gl.vertexAttribPointer(alphaLoc, 1, gl.FLOAT, false, FLOATS_PER_VERTEX * 4, 5 * 4);
    gl.drawArrays(gl.TRIANGLES, 0, quads * 6);

    drawnQuads += quads;
    quads = 0;
    count = 0;
  }

  /** Upload and draw the textured quads that use the same photo. */
  function flushTex() {
    if (texQuads === 0) return;

    gl.useProgram(texProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, texData.subarray(0, texCount), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(texPosLoc);
    gl.enableVertexAttribArray(texUvLoc);
    gl.enableVertexAttribArray(texColorLoc);
    gl.vertexAttribPointer(texPosLoc, 2, gl.FLOAT, false, TEX_FLOATS_PER_VERTEX * 4, 0);
    gl.vertexAttribPointer(texUvLoc, 2, gl.FLOAT, false, TEX_FLOATS_PER_VERTEX * 4, 2 * 4);
    gl.vertexAttribPointer(texColorLoc, 3, gl.FLOAT, false, TEX_FLOATS_PER_VERTEX * 4, 4 * 4);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textures.get(texName));
    gl.uniform1i(texSampler, 0);
    gl.uniform1f(texDisc, discMask ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, texQuads * 6);

    drawnQuads += texQuads;
    texQuads = 0;
    texCount = 0;
  }

  /** Set the canvas pixel size to its display size times the device scale. */
  function resize(cssWidth, cssHeight, scale) {
    canvas.width = Math.max(1, Math.round(cssWidth * scale));
    canvas.height = Math.max(1, Math.round(cssHeight * scale));
    // WebGL keeps the viewport from context creation, so update it after
    // changing the canvas size or only a small part of the canvas is drawn.
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  /** Upload the RGBA pixel buffers of the loaded textures to the GPU. */
  function setTextures(list) {
    for (const item of list) {
      if (!item.pixels) continue;

      const texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        item.size,
        item.size,
        0,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        item.pixels
      );
      // 512 is a power of two, so tiling with REPEAT is allowed in WebGL 1.
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      textures.set(item.name, texture);
    }
    return [...textures.keys()];
  }

  /** Append 6 vertices (2 triangles) to the flat batch. */
  function push(x1, y1, x2, y2, cBottom, cTop, alpha = 1) {
    const corners = [
      [x1, y1, cBottom, alpha],
      [x2, y1, cBottom, alpha],
      [x1, y2, cTop, alpha],
      [x1, y2, cTop, alpha],
      [x2, y1, cBottom, alpha],
      [x2, y2, cTop, alpha],
    ];
    for (const c of corners) {
      data[count++] = c[0];
      data[count++] = c[1];
      data[count++] = c[2][0];
      data[count++] = c[2][1];
      data[count++] = c[2][2];
      data[count++] = c[3];
    }
    quads += 1;
  }

  /** Append 6 vertices (2 triangles) to the textured batch. */
  function pushTexQuad(verts, color) {
    for (const v of verts) {
      texData[texCount++] = v[0];
      texData[texCount++] = v[1];
      texData[texCount++] = v[2];
      texData[texCount++] = v[3];
      texData[texCount++] = color[0];
      texData[texCount++] = color[1];
      texData[texCount++] = color[2];
    }
    texQuads += 1;
  }

  /**
   * Draw a box given in world coordinates, using `cam` for the view transform
   * (a scaled camera is used for parallax layers).
   */
  function rect(x, y, w, h, color, cam, view, topColor, alpha = 1) {
    if (quads >= MAX_QUADS) return;
    if (!inView({ x, y, w, h }, cam, view)) return;

    const x1 = ((x - cam.x) * 2) / view.w;
    const y1 = ((y - cam.y) * 2) / view.h;
    const x2 = ((x + w - cam.x) * 2) / view.w;
    const y2 = ((y + h - cam.y) * 2) / view.h;
    push(x1, y1, x2, y2, color, topColor || color, alpha);
  }

  /** Draw a box directly in clip space (-1..1) for the fixed sky layer. */
  function rectClip(x, y, w, h, color, alpha = 1) {
    if (quads >= MAX_QUADS) return;
    push(x, y, x + w, y + h, color, color, alpha);
  }

  /**
   * Draw a box with a real photo texture. `scale` is the number of world units
   * one texture tile covers. Returns false when the texture is not loaded, so
   * the caller can fall back to a flat colour.
   */
  function rectTex(x, y, w, h, tint, cam, view, name, scale) {
    if (!textures.has(name) || quads >= MAX_QUADS) return false;
    if (!inView({ x, y, w, h }, cam, view)) return false;

    // A batch can only carry one texture, so switch by flushing the old one.
    if (texQuads >= MAX_TEX_QUADS || (texName !== null && texName !== name)) flushTex();
    texName = name;
    discMask = false;

    // The clip positions move with the camera, the uv values stay in world
    // space, so the photo never slides when the player jumps.
    pushTexQuad(texturedQuad(x, y, w, h, cam, view, scale), tint);
    return true;
  }

  /** Draw one photo-textured circle in clip space with a soft edge. */
  function discTex(cx, cy, radius, tint, name) {
    if (!textures.has(name) || texQuads >= MAX_TEX_QUADS) return;
    if (texQuads > 0 && texName !== name) flushTex();

    texName = name;
    discMask = true;

    // A square in clip space is stretched on a wide screen, so the height is
    // multiplied by the aspect ratio to keep the disc round on the display.
    const aspect = canvas.width / canvas.height;
    pushTexQuad(
      [
        [cx - radius, cy - radius * aspect, 0, 1],
        [cx + radius, cy - radius * aspect, 1, 1],
        [cx - radius, cy + radius * aspect, 0, 0],
        [cx - radius, cy + radius * aspect, 0, 0],
        [cx + radius, cy - radius * aspect, 1, 1],
        [cx + radius, cy + radius * aspect, 1, 0],
      ],
      tint
    );
  }

  /**
   * Approximate a round circle in clip space with a stack of thin boxes.
   * A clip-space square is stretched on a wide screen, so the vertical radius
   * is the horizontal one times the aspect ratio to end up round on display.
   */
  function discClip(cx, cy, radius, color, alpha = 1) {
    if (radius <= 0.01) return;
    const aspect = canvas.width / canvas.height;
    const halfY = radius * aspect;
    const rows = 24;
    const rowH = (2 * halfY) / rows;

    for (let i = 0; i < rows; i++) {
      const dy = -halfY + (i + 0.5) * rowH;
      const t = dy / halfY;
      const half = radius * Math.sqrt(Math.max(0, 1 - t * t));
      rectClip(cx - half, cy + dy - rowH / 2, half * 2, rowH, color, alpha);
    }
  }

  /** Draw the sky as one full-screen vertical gradient. */
  function background(topColor, bottomColor) {
    push(-1, -1, 1, 1, bottomColor, topColor, 1);
  }

  /**
   * Draw one city building of the parallax skyline.
   * `b.y` is the ground line of the lot, the tower is drawn down past the
   * bottom of the screen so it never looks cut off in mid-air.
   */
  function drawBuilding(b, cam, view, near, time) {
    // Distant buildings are hazier and lighter, the ones in front are darker.
    const color = near ? [0.16, 0.21, 0.29] : [0.24, 0.31, 0.4];
    const top = b.y + b.h;
    const base = belowBottom(cam, view);

    rect(b.x, base, b.w, top - base, color, cam, view);
    rect(b.x + b.w * 0.08, top, b.w * 0.84, 0.5, mix(color, [1, 1, 1], 0.1), cam, view);

    const cols = Math.max(1, Math.floor(b.w / 1.4));
    // Rows are counted from the roof downwards; rows below the view are dropped
    // by the visibility test inside rect(), so they cost nothing.
    const rows = Math.max(1, Math.min(16, Math.floor((top - base) / 1.7)));
    const litChance = near ? 0.6 : 0.3;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const seed = hash(b.id * 97 + r, c);
        // A few windows blink over time so the city looks alive.
        const blink = seed > 0.88 && Math.floor(time * 1.5 + b.id + r) % 2 === 0;
        const lit = seed < litChance || blink;
        const windowColor = lit ? (near ? [0.93, 0.78, 0.38] : [0.62, 0.68, 0.55]) : mix(color, [0, 0, 0], 0.3);
        rect(b.x + 0.35 + c * 1.4, top - 1.2 - r * 1.7, 0.7, 0.9, windowColor, cam, view);
      }
    }

    if (near && hash(b.id, 17) > 0.6) {
      rect(b.x + b.w * 0.45, top + 0.5, 0.2, 1.8, [0.36, 0.42, 0.5], cam, view);
    }
    if (near && hash(b.id, 29) > 0.7) {
      rect(b.x - 0.6, top - b.h * 0.5, 0.6, 0.5, [0.3, 0.36, 0.44], cam, view); // side tower
    }
  }

  /** Draw one platform: a photo body when the texture is loaded, otherwise a
   * procedural brick or plank pattern. */
  function drawPlatform(plat, cam, view) {
    if (plat.kind === "wall") {
      rect(plat.x, plat.y, plat.w, plat.h, [0.33, 0.36, 0.43], cam, view);
      for (let cy = 0; cy < Math.floor(plat.h); cy++) {
        rect(plat.x, plat.y + cy + 0.35, plat.w, 0.12, [0.26, 0.29, 0.35], cam, view);
      }
      return;
    }

    const body = plat.kind === "ground" ? [0.31, 0.4, 0.32] : [0.55, 0.49, 0.42];
    const top = plat.kind === "ground" ? [0.41, 0.76, 0.44] : [0.86, 0.78, 0.58];

    // The real photo (brick for ground, wood for floating platforms) is drawn
    // as one textured quad and flushed immediately, so the flat details that
    // follow always end up on top of it.
    const photo = rectTex(
      plat.x,
      plat.y,
      plat.w,
      plat.h,
      body,
      cam,
      view,
      plat.kind === "ground" ? "brick" : "wood",
      plat.kind === "ground" ? 3 : 2
    );
    flushTex();

    if (photo) {
      // One thin mortar line keeps the brick photo connected to the game's own
      // look without hiding the photograph.
      rect(plat.x, plat.y + plat.h - 0.5, plat.w, 0.1, mix(body, [0, 0, 0], 0.2), cam, view);
    } else {
      // Procedural brick texture: mortar lines plus a few bricks in a slightly
      // different shade.
      const mortar = mix(body, [0, 0, 0], 0.22);
      const columns = Math.floor(plat.w);
      const rows = Math.floor(plat.h);

      for (let cy = 0; cy < rows; cy++) {
        rect(plat.x, plat.y + cy + 0.9, plat.w, 0.1, mortar, cam, view);
        const offset = cy % 2 === 0 ? 0 : 0.5;
        for (let cx = 0; cx <= columns; cx++) {
          const bx = plat.x + cx + offset;
          if (bx < plat.x + plat.w - 0.05) rect(bx, plat.y + cy, 0.1, 0.9, mortar, cam, view);
        }
        for (let cx = 0; cx < columns; cx++) {
          if (hash(Math.round(plat.x * 10) + cx, Math.round(plat.y * 10) + cy) < 0.28) {
            rect(plat.x + cx + offset + 0.1, plat.y + cy + 0.12, 0.8, 0.72, mix(body, [1, 1, 1], 0.07), cam, view);
          }
        }
      }
    }

    rect(plat.x, plat.top - 0.35, plat.w, 0.35, top, cam, view);

    // Grass blades and small flowers on the walkable surface.
    if (plat.kind === "ground") {
      for (let i = 0; i < Math.floor(plat.w * 2); i++) {
        const gx = plat.x + 0.2 + i * 0.5 + hash(i, Math.round(plat.top * 10)) * 0.25;
        if (gx > plat.x + plat.w - 0.2) break;
        const hgt = 0.15 + hash(i, Math.round(plat.y * 10)) * 0.4;
        rect(gx, plat.top, 0.1, hgt, mix(top, [0.18, 0.44, 0.28], 0.4), cam, view);
      }
    }
  }

  /** Draw scenery: bush, tree, flower, rock or street lamp. */
  function drawDecor(d, cam, view) {
    if (d.type === "bush") {
      rect(d.x, d.y, d.w, d.h, [0.28, 0.58, 0.4], cam, view, [0.4, 0.72, 0.5]);
      rect(d.x + d.w * 0.18, d.y + d.h * 0.6, d.w * 0.64, d.h * 0.4, [0.43, 0.76, 0.52], cam, view);
      rect(d.x + d.w * 0.1, d.y + d.h * 0.15, 0.14, 0.14, [0.2, 0.44, 0.33], cam, view);
      rect(d.x + d.w * 0.6, d.y + d.h * 0.35, 0.14, 0.14, [0.2, 0.44, 0.33], cam, view);
    } else if (d.type === "tree") {
      rect(d.x, d.y, d.w, d.h, [0.38, 0.29, 0.22], cam, view);
      rect(d.x - d.w * 0.6, d.y + d.h * 0.55, d.w * 2.2, d.h * 0.45, [0.33, 0.6, 0.43], cam, view);
      rect(d.x - d.w * 0.3, d.y + d.h * 0.7, d.w * 1.2, d.h * 0.25, [0.45, 0.72, 0.52], cam, view);
      rect(d.x - d.w * 0.5, d.y + d.h * 0.6, 0.16, 0.16, [0.22, 0.45, 0.35], cam, view);
    } else if (d.type === "flower") {
      rect(d.x + d.w * 0.4, d.y, d.w * 0.2, d.h, [0.3, 0.55, 0.4], cam, view);
      rect(d.x, d.y + d.h * 0.55, d.w, d.h * 0.45, [0.86, 0.5, 0.6], cam, view, [0.95, 0.66, 0.72]);
      rect(d.x + d.w * 0.35, d.y + d.h * 0.7, d.w * 0.3, d.h * 0.2, [0.98, 0.86, 0.4], cam, view);
    } else if (d.type === "rock") {
      rect(d.x, d.y, d.w, d.h, [0.49, 0.51, 0.55], cam, view, [0.58, 0.6, 0.64]);
      rect(d.x + d.w * 0.2, d.y + d.h * 0.3, d.w * 0.3, d.h * 0.3, [0.42, 0.44, 0.48], cam, view);
    } else if (d.type === "lamp") {
      rect(d.x, d.y, 0.16, d.h, [0.3, 0.33, 0.38], cam, view);
      rect(d.x - 0.3, d.y + d.h - 0.5, 0.76, 0.5, [0.95, 0.85, 0.45], cam, view, [1, 0.95, 0.65]);
      rect(d.x - 0.5, d.y + d.h - 0.9, 1.16, 0.4, [0.62, 0.56, 0.4], cam, view);
    }
  }

  /** Approximate a filled disc with a stack of thin rectangles. */
  function disc(cx, cy, r, color, cam, view) {
    if (r <= 0.05) return;
    const rows = 9;
    const rowH = (2 * r) / rows;

    for (let i = 0; i < rows; i++) {
      const dy = -r + (i + 0.5) * rowH;
      const half = r * Math.sqrt(Math.max(0, 1 - (dy / r) * (dy / r)));
      rect(cx - half, cy + dy - rowH / 2, half * 2, rowH, color, cam, view);
    }
  }

  /** Draw a jet fighter crossing the sky, nose pointed in its travel direction. */
  function drawJet(jet, cam, view, time) {
    const body = [0.8, 0.84, 0.9];
    const dark = [0.44, 0.49, 0.57];
    const front = jet.dir > 0 ? jet.x + jet.w : jet.x;
    const back = jet.dir > 0 ? jet.x : jet.x + jet.w;

    // Exhaust trail behind the aircraft.
    const trail = 3 + 2 * Math.abs(Math.sin(time * 3 + jet.id));
    rect(jet.dir > 0 ? back - trail : back, jet.y + jet.h * 0.35, trail, 0.22, [0.55, 0.62, 0.7], cam, view);

    // Fuselage, nose cone, wing and tail fin.
    rect(jet.x, jet.y, jet.w, jet.h, body, cam, view, mix(body, [1, 1, 1], 0.12));
    rect(jet.dir > 0 ? front : front - 0.8, jet.y + jet.h * 0.3, 0.8, jet.h * 0.4, body, cam, view);
    rect(jet.x + jet.w * 0.2, jet.y - 0.55, jet.w * 0.55, 0.55, dark, cam, view);
    rect(jet.dir > 0 ? back : back - 0.5, jet.y + jet.h, 0.5, 0.75, dark, cam, view);
    rect(jet.x + jet.w * 0.6, jet.y + jet.h * 0.5, jet.w * 0.22, 0.32, [0.2, 0.26, 0.34], cam, view);

    // Flickering engine flame at the rear.
    const flame = 0.5 + 0.4 * Math.abs(Math.sin(time * 12 + jet.id));
    rect(jet.dir > 0 ? back - flame : back, jet.y + jet.h * 0.3, flame, jet.h * 0.4, [0.95, 0.62, 0.3], cam, view);
  }

  /** Draw a falling bomb, its dashed drop line and the blinking ground marker. */
  function drawBomb(bomb, cam, view, time) {
    // Every other frame the warning flashes, so the player sees it clearly.
    const blink = Math.floor(time * 8) % 2 === 0;

    if (bomb.targetY !== null) {
      // Dashed line showing exactly where the bomb will land.
      const lineColor = blink ? [0.95, 0.45, 0.35] : [0.6, 0.3, 0.28];
      for (let y = bomb.targetY; y < bomb.y; y += 0.8) {
        rect(bomb.x - 0.07, y, 0.14, 0.4, lineColor, cam, view);
      }

      // Danger marker on the ground: a wide bar with a bright core above it.
      rect(bomb.x - 1.1, bomb.targetY, 2.2, 0.22, blink ? [0.92, 0.36, 0.3] : [0.66, 0.26, 0.24], cam, view);
      rect(bomb.x - 0.4, bomb.targetY + 0.22, 0.8, 0.3, blink ? [1, 0.55, 0.4] : [0.8, 0.4, 0.35], cam, view);
    }

    // The bomb itself: dark body, fins, blinking fuse light.
    rect(bomb.x - bomb.w / 2, bomb.y, bomb.w, bomb.h, [0.32, 0.34, 0.39], cam, view, [0.5, 0.52, 0.58]);
    rect(bomb.x - 0.28, bomb.y + bomb.h, 0.56, 0.28, [0.45, 0.47, 0.52], cam, view);
    rect(bomb.x - 0.1, bomb.y + bomb.h + 0.28, 0.2, 0.28, blink ? [1, 0.7, 0.3] : [0.5, 0.35, 0.2], cam, view);
  }

  /** Draw an explosion: a growing fireball with a bright core and dark smoke. */
  function drawBlast(blast, cam, view, time) {
    const age = Math.min(1, (time - blast.start) / (blast.duration || BLAST_DURATION));
    const r = blast.radius * (0.4 + 0.6 * age);
    const center = blast.y + r * 0.6;

    // Scorch mark on the solid ground the bomb hit.
    rect(blast.x - r, blast.y, r * 2, 0.18, [0.2, 0.22, 0.26], cam, view);

    disc(blast.x, center, r, [0.35, 0.33, 0.32], cam, view); // smoke
    disc(blast.x, center, r * 0.72, [0.92, 0.45, 0.22], cam, view); // flame
    disc(blast.x, center, r * 0.4, [1, 0.9, 0.55], cam, view); // hot core

    // Fragments flung sideways; hash keeps them scattered but stable.
    for (let i = 0; i < 6; i++) {
      const spread = r * (0.6 + hash(Math.round(blast.x * 10), i) * 0.8);
      rect(blast.x + spread, center + age * 1.2, 0.25, 0.25, [0.35, 0.33, 0.32], cam, view);
      rect(blast.x - spread, center + age * 1.5, 0.25, 0.25, [0.35, 0.33, 0.32], cam, view);
    }
  }

  /** Draw the moon: a soft halo and the photo disc on its arc across the sky. */
  function drawMoon(time) {
    const moon = moonPosition(time);
    const tint = moonTint(moon.altitude);

    // The halo is a big half-transparent disc, so the moon lights the sky.
    discClip(moon.x, moon.y, MOON_RADIUS * 1.9, mix(tint, [1, 1, 1], 0.3), 0.16 + 0.1 * moon.altitude);

    if (textures.has("moon")) {
      discTex(moon.x, moon.y, MOON_RADIUS, tint, "moon");
    } else {
      discClip(moon.x, moon.y, MOON_RADIUS, tint);
    }
  }

  /** Render one frame of the scene. */
  function draw(scene) {
    quads = 0;
    count = 0;
    texQuads = 0;
    texCount = 0;
    texName = null;
    drawnQuads = 0;
    const { cam, view, world, player, enemies, threats, time, moonTime } = scene;

    gl.clear(gl.COLOR_BUFFER_BIT);

    background([0.09, 0.14, 0.26], [0.6, 0.76, 0.84]);

    // Fixed sky layer: the stars never move with the camera.
    for (let i = 0; i < 42; i++) {
      const sx = -1 + (i * 0.049) % 2;
      const sy = 0.06 + ((i * 0.137) % 0.85);
      rectClip(sx, sy, 0.006, 0.006, [0.85, 0.9, 0.95]);
    }

    // The moon is drawn before the city, so the skyline can hide it while it
    // rises and sets.
    drawMoon(moonTime === undefined ? time : moonTime);
    flushFlat();
    flushTex();

    // Slow drifting clouds: thin haze strips with a lighter core.
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 0.42 + time * 0.012) % 2.4) - 1.2;
      const cy = 0.16 + ((i * 0.31) % 0.62);
      rectClip(cx, cy, 0.42, 0.035, [0.4, 0.5, 0.6], 0.55);
      rectClip(cx + 0.08, cy + 0.035, 0.24, 0.03, [0.45, 0.55, 0.65], 0.55);
      rectClip(cx + 0.05, cy - 0.02, 0.14, 0.02, [0.38, 0.47, 0.57], 0.55);
    }

    // Far city skyline and distant hills (slow parallax).
    const farCam = { x: cam.x * 0.22, y: cam.y * 0.12 };
    const farBase = belowBottom(farCam, view);
    for (const b of world.buildings) {
      if (b.layer === 0) drawBuilding(b, farCam, view, false, time);
    }
    for (const hill of world.hills) {
      rect(hill.x, farBase, hill.w, hill.y + hill.h * 0.5 - farBase, [0.2, 0.28, 0.36], farCam, view);
    }

    // Nearer city layer (faster parallax than the far one).
    const midCam = { x: cam.x * 0.48, y: cam.y * 0.28 };
    for (const b of world.buildings) {
      if (b.layer === 1) drawBuilding(b, midCam, view, true, time);
    }

    // The skyline sits behind the level, so it must reach the GPU first.
    flushFlat();

    // Platforms with texture.
    for (const plat of world.platforms) drawPlatform(plat, cam, view);

    // Scenery on the platforms.
    for (const d of world.decor) drawDecor(d, cam, view);

    // Patrolling enemies: purple blocks with eyes and animated legs.
    for (const e of enemies) {
      if (!inView({ x: e.x, y: e.y, w: e.w, h: e.h }, cam, view)) continue;
      const h = e.h * (1 - e.squash * 0.7);
      rect(e.x, e.y, e.w, h, [0.52, 0.31, 0.66], cam, view, [0.71, 0.45, 0.82]);

      if (e.squash < 0.9) {
        const eyeY = e.y + h * 0.45;
        const eyeX = e.dir > 0 ? e.x + e.w - 0.45 : e.x + 0.15;
        rect(eyeX, eyeY, 0.3, 0.3, [0.98, 0.96, 0.9], cam, view);
        rect(eyeX + 0.12, eyeY + 0.12, 0.14, 0.14, [0.1, 0.1, 0.12], cam, view);

        const leg = 0.25 * Math.abs(Math.sin(time * 6 + e.x));
        rect(e.x + 0.1, e.y - leg * 0.5, 0.25, 0.2, [0.34, 0.2, 0.44], cam, view);
        rect(e.x + e.w - 0.35, e.y - leg * 0.4, 0.25, 0.2, [0.34, 0.2, 0.44], cam, view);
      }
    }

    // The player character.
    if (player) {
      const p = player;
      rect(p.x, p.y, p.w, p.h, [0.92, 0.47, 0.33], cam, view, [0.99, 0.55, 0.42]);
      rect(p.x + 0.05, p.y + p.h - 0.45, p.w - 0.1, 0.45, [0.23, 0.55, 0.86], cam, view);
      rect(p.x + 0.05, p.y + p.h - 0.45, p.w - 0.1, 0.12, [0.3, 0.68, 0.95], cam, view);

      const eyeX = p.face > 0 ? p.x + 0.12 : p.x + p.w - 0.42;
      rect(eyeX, p.y + p.h - 0.95, 0.3, 0.32, [0.98, 0.97, 0.93], cam, view);
      rect(eyeX + 0.12, p.y + p.h - 0.85, 0.13, 0.16, [0.12, 0.14, 0.18], cam, view);

      const swing = Math.abs(Math.sin(time * 9)) * 0.28;
      rect(p.x + 0.1, p.y - (p.onGround ? swing : 0.1), 0.25, 0.28, [0.7, 0.33, 0.25], cam, view);
      rect(p.x + p.w - 0.35, p.y - (p.onGround ? 0.28 - swing : 0.1), 0.25, 0.28, [0.7, 0.33, 0.25], cam, view);
      rect(p.x - 0.2, p.y + p.h * 0.4, 0.2, 0.45, [0.85, 0.4, 0.3], cam, view);
      rect(p.x + p.w, p.y + p.h * 0.4, 0.2, 0.45, [0.85, 0.4, 0.3], cam, view);
    }

    // Jets, falling bombs and explosions are drawn last so they sit on top of
    // the level and stay readable against the sky.
    if (threats) {
      for (const jet of threats.jets) drawJet(jet, cam, view, time);
      for (const bomb of threats.bombs) drawBomb(bomb, cam, view, time);
      for (const blast of threats.blasts) drawBlast(blast, cam, view, time);
    }

    flushFlat();
    return drawnQuads;
  }

  return { resize, draw, setTextures, gl };
}

/** Compile and link one vertex + fragment shader pair into a program. */
function buildProgram(gl, vertexSource, fragmentSource) {
  const program = gl.createProgram();
  const sources = [
    [vertexSource, gl.VERTEX_SHADER],
    [fragmentSource, gl.FRAGMENT_SHADER],
  ];

  for (const [source, type] of sources) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error("Shader compile error: " + gl.getShaderInfoLog(shader));
    }
    gl.attachShader(program, shader);
  }

  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error("Shader link error: " + gl.getProgramInfoLog(program));
  }
  return program;
}

/* ---- src/textures.js ---- */
// Purpose: Load a few real photo textures from the internet (Wikimedia
// Commons) and turn them into square RGBA pixel buffers WebGL can upload. If a
// download fails, a small procedural pattern is generated instead so the game
// still looks good without a network connection.



const TEXTURE_SIZE = 512; // power of two, so WebGL 1 may tile it (REPEAT)

/** The three textures the renderer uses. Kept small on purpose. */
const TEXTURES = [
  {
    name: "moon",
    url: "https://upload.wikimedia.org/wikipedia/commons/0/01/Phase-180.jpg",
    credit: "Moon photo: Jay Tanner, CC BY-SA 3.0 (Wikimedia Commons)",
  },
  {
    name: "brick",
    url: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Surfaces_brick_wall_with_mortar_closeup_view.JPG",
    credit: "Brick wall: Tomwsulcer, CC0 (Wikimedia Commons)",
  },
  {
    name: "wood",
    url: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Wood_planks_-_Preview_%28Amal_Kumar_via_Poly_Haven%29.webp",
    credit: "Wood planks: Amal Kumar via Poly Haven, CC0 (Wikimedia Commons)",
  },
];

/** RGB colour of one pixel of the procedural stand-in pattern. */
function pattern(name, x, y, size) {
  if (name === "brick") {
    const rowH = 32;
    const brickW = 64;
    const row = Math.floor(y / rowH);
    const offset = row % 2 === 0 ? 0 : brickW / 2;
    if (y % rowH < 2 || (x + offset) % brickW < 2) return [135, 135, 128]; // mortar
    const shade =
      (0.85 + 0.3 * hash(Math.floor((x + offset) / brickW), row)) * (0.94 + 0.12 * hash(x, y));
    return [Math.round(140 * shade), Math.round(92 * shade), Math.round(72 * shade)];
  }

  if (name === "wood") {
    const plank = 64;
    const row = Math.floor(y / plank);
    if (y % plank < 2) return [58, 42, 30]; // gap between planks
    const shade = (0.8 + 0.3 * hash(row, 5)) * (0.9 + 0.2 * hash(Math.floor(x / 3), row * 13));
    return [Math.round(150 * shade), Math.round(120 * shade), Math.round(88 * shade)];
  }

  // moon: pale grey rock with a handful of darker craters
  const nx = (x + 0.5) / size;
  const ny = (y + 0.5) / size;
  let shade = 0.78 + 0.12 * hash(Math.floor(x / 6), Math.floor(y / 6));
  for (let i = 0; i < 8; i++) {
    const cx = hash(i, 3);
    const cy = hash(i, 7);
    const r = 0.05 + hash(i, 11) * 0.08;
    const d = Math.sqrt((nx - cx) * (nx - cx) + (ny - cy) * (ny - cy));
    if (d < r) shade -= 0.22 * (1 - d / r);
  }
  return [Math.round(248 * shade), Math.round(250 * shade), Math.round(238 * shade)];
}

/** Build a size x size RGBA buffer for one texture without any network access. */
function fallbackPixels(name, size = TEXTURE_SIZE) {
  const pixels = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const [r, g, b] = pattern(name, x, y, size);
      pixels[i] = r;
      pixels[i + 1] = g;
      pixels[i + 2] = b;
      pixels[i + 3] = 255;
    }
  }
  return pixels;
}

/**
 * Download an image and cut its centre square into a size x size RGBA buffer.
 * Throws when the network or the image decoder is not available.
 */
async function fetchPixels(url, size = TEXTURE_SIZE) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);

  const blob = await response.blob();
  if (typeof createImageBitmap !== "function") throw new Error("no image decoder");

  const image = await createImageBitmap(blob);
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  const side = Math.min(image.width, image.height);
  ctx.drawImage(
    image,
    Math.floor((image.width - side) / 2),
    Math.floor((image.height - side) / 2),
    side,
    side,
    0,
    0,
    size,
    size
  );

  if (typeof image.close === "function") image.close();
  return new Uint8Array(ctx.getImageData(0, 0, size, size).data);
}

/**
 * Load every texture. Each entry carries the pixel buffer plus ok/source so the
 * HUD can tell a real photo from the procedural stand-in.
 */
async function loadTextures() {
  const loaded = [];

  for (const texture of TEXTURES) {
    try {
      loaded.push({ ...texture, ok: true, source: "internet", size: TEXTURE_SIZE, pixels: await fetchPixels(texture.url) });
    } catch (error) {
      loaded.push({
        ...texture,
        ok: false,
        source: "fallback",
        error: error.message,
        size: TEXTURE_SIZE,
        pixels: fallbackPixels(texture.name),
      });
    }
  }

  return loaded;
}

/* ---- src/hud.js ---- */
// Purpose: Write the game numbers into the HTML HUD (score, lives, seed, ...),
// show the bomb warning and the game over overlay, and report which photo
// textures were loaded. index.html defines the elements by id.

const ALERT_TEXT = "Bomb incoming!"; // shown while a bomb is in the air
const CREDIT_SEPARATOR = " · ";

/** Find every HUD element the game writes to. */
function findHudElements() {
  return {
    score: document.getElementById("score"),
    lives: document.getElementById("lives"),
    seed: document.getElementById("seed"),
    enemies: document.getElementById("enemies"),
    distance: document.getElementById("distance"),
    bombs: document.getElementById("bombs"),
    status: document.getElementById("status"),
    alert: document.getElementById("alert"),
    credits: document.getElementById("credits"),
    overlay: document.getElementById("overlay"),
  };
}

/** Show the counters of the current run in the HUD bar. */
function updateHud(hud, run, world, threats) {
  hud.score.textContent = String(run.score);
  hud.lives.textContent = String(Math.max(0, run.lives));
  hud.seed.textContent = String(world.seed);
  hud.enemies.textContent = String(run.stomps);
  hud.distance.textContent = String(run.farthest);
  hud.bombs.textContent = String(run.bombsDropped);
  hud.alert.textContent = threats && threats.bombs.length > 0 ? ALERT_TEXT : "";
}

/** Show a message in the centred overlay, for example "Game over". */
function showOverlay(hud, text) {
  hud.overlay.textContent = text;
  hud.overlay.classList.remove("hidden");
}

/** Report how many photo textures really arrived and who made them. */
function reportTextures(hud, textures) {
  const loaded = textures.filter((texture) => texture.ok).length;
  hud.status.textContent = "WebGL ready - " + loaded + " of " + textures.length + " photo textures";
  hud.credits.textContent = textures.map((texture) => texture.credit).join(CREDIT_SEPARATOR);
}

/* ---- src/input.js ---- */
// Purpose: Keep track of the keys that are pressed, hand the physics the input
// object it expects, and run the key that starts a new world.

const RESTART_KEY = "r"; // starts a run with a fresh random seed

// Keys the page must not react to: without this the player would scroll the
// document while jumping (space) or running (arrow keys).
const GAME_KEYS = [" ", "w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"];

/**
 * Start listening to the keyboard.
 * `onRestart` runs when the restart key is pressed.
 * Returns { readInput } for the game loop.
 */
function createKeyboard(onRestart) {
  const pressed = new Set();

  window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if (key === RESTART_KEY) {
      onRestart();
      return;
    }

    pressed.add(key);
    if (GAME_KEYS.includes(key)) event.preventDefault();
  });

  window.addEventListener("keyup", (event) => pressed.delete(event.key.toLowerCase()));

  return { readInput: () => readInput(pressed) };
}

/** Turn the pressed keys into the input object used by the physics. */
function readInput(pressed) {
  return {
    left: pressed.has("a") || pressed.has("arrowleft"),
    right: pressed.has("d") || pressed.has("arrowright"),
    jump: pressed.has(" ") || pressed.has("w") || pressed.has("arrowup"),
    down: pressed.has("s") || pressed.has("arrowdown"),
  };
}

/* ---- src/debug.js ---- */
// Purpose: Put the running game on window.__game so the headless browser checks
// in tools/verify-browser.mjs (and the developer console) can start a run,
// steer it and read back what is currently on screen.
// The hooks must keep their names and result shapes: every browser check that
// fails costs a whole verification run.



const STOMP_DROP_HEIGHT = 3; // the test player is dropped this far above an enemy
const STOMP_FALL_SPEED = -6; // speed used while dropping onto it
const MIN_RECT_PIXELS = 1; // a pixel read-back may never be smaller than one pixel

/**
 * Install the window.__game object.
 * `api` is the small set of getters main.js offers: newGame, world, player,
 * threats, camera, view, canvas, gl, renderFrame, time, moonTime, setMoonPhase,
 * textures, run and quads.
 */
function installDebugHooks(api) {
  window.__game = {
    newGame: api.newGame,
    /** Camera and view, so checks can prove the player is on screen. */
    camera: api.camera,
    view: api.view,
    /** Drop the player above a live enemy so the stomp rule can be checked. */
    debugStomp: () => dropOntoEnemy(api),
    /** Force a jet to appear on the next physics step. */
    spawnJet: () => launchJet(api),
    /** Where the moon currently is on its arc (clip space, -1..1). */
    moon: () => moonPosition(api.moonTime()),
    /** Start the moon arc at a chosen moment of the cycle. */
    setMoonPhase: (seconds) => {
      api.setMoonPhase(seconds);
      return moonPosition(seconds);
    },
    /** Which textures were really downloaded and which use the stand-in. */
    textures: api.textures,
    /** One platform of the current world, for the pixel checks. */
    platform: (index) => {
      const world = api.world();
      return world ? world.platforms[index] : null;
    },
    readWorldRect: (x, y, w, h) => readWorldRect(api, x, y, w, h),
    state: () => readState(api),
  };
}

/**
 * Read the pixels of a world rectangle straight from the WebGL canvas.
 * Proves that a photo texture stays anchored to the world while the camera
 * moves, which a plain pixel diff of two screenshots cannot show.
 */
function readWorldRect(api, x, y, w, h) {
  const gl = api.gl();
  const canvas = api.canvas();
  const cam = api.camera();
  const view = api.view();

  // Redraw first: after a frame is presented the browser may reuse the
  // framebuffer, so readPixels only reliably sees the geometry just drawn.
  api.renderFrame();

  const left = ((x - cam.x) * 2) / view.w;
  const bottom = ((y - cam.y) * 2) / view.h;
  const right = ((x + w - cam.x) * 2) / view.w;
  const top = ((y + h - cam.y) * 2) / view.h;

  const px = Math.round(((left + 1) / 2) * canvas.width);
  const py = Math.round(((bottom + 1) / 2) * canvas.height);
  const pw = Math.max(MIN_RECT_PIXELS, Math.round(((right - left) / 2) * canvas.width));
  const ph = Math.max(MIN_RECT_PIXELS, Math.round(((top - bottom) / 2) * canvas.height));

  const pixels = new Uint8Array(pw * ph * 4);
  gl.readPixels(px, py, pw, ph, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  return {
    px,
    py,
    pw,
    ph,
    cam: { x: cam.x, y: cam.y },
    canvasWidth: canvas.width,
    canvasHeight: canvas.height,
    pixels: Array.from(pixels),
  };
}

/** Move the player above a live enemy so the next steps stomp it. */
function dropOntoEnemy(api) {
  const world = api.world();
  const player = api.player();
  if (!world || !player) return null;

  const enemy = world.enemies.find((e) => e.alive);
  if (!enemy) return null;

  player.x = enemy.x;
  player.y = enemy.y + STOMP_DROP_HEIGHT;
  player.vx = 0;
  player.vy = STOMP_FALL_SPEED;
  player.onGround = false;
  return enemy.x;
}

/** Ask the threat logic for a jet right now instead of after a few seconds. */
function launchJet(api) {
  const threats = api.threats();
  if (!threats) return null;

  threats.nextJet = api.time();
  return threats.nextJet;
}

/** Collect the counters and positions the checks compare against. */
function readState(api) {
  const world = api.world();
  const player = api.player();
  const threats = api.threats();
  const run = api.run();

  return {
    seed: world ? world.seed : null,
    time: api.time(),
    moon: moonPosition(api.moonTime()),
    platforms: world ? world.platforms.length : 0,
    enemies: world ? world.enemies.length : 0,
    stomps: run.stomps,
    score: run.score,
    lives: run.lives,
    farthest: run.farthest,
    jets: threats ? threats.jets.length : 0,
    bombsInAir: threats ? threats.bombs.length : 0,
    blasts: threats ? threats.blasts.length : 0,
    bombsDropped: run.bombsDropped,
    textures: api.textures(),
    player: player ? { x: player.x, y: player.y, vy: player.vy, onGround: player.onGround } : null,
    quads: api.quads(),
    enemiesMoving: world ? world.enemies.filter((e) => e.alive).map((e) => ({ x: e.x, dir: e.dir })) : [],
  };
}

/* ---- src/main.js ---- */
// Purpose: Run the jump-and-run game loop: read keyboard input, advance the
// physics, regenerate the world as the player moves, draw with WebGL and update
// the HUD. This file only connects the modules; all rules live in world.js,
// physics.js, jets.js and moon.js, all drawing in the renderer modules.











// Loop timing.
const PHYSICS_STEP = 1 / 120; // fixed sub-step for stable collisions
const MAX_FRAME_TIME = 0.05; // a longer pause (lag) is not simulated

// Run setup.
const START_LIVES = 3;
const START_SEED = 1234; // seed used when the URL carries none
const RANDOM_SEED_RANGE = 0xffffffff; // full 32 bit span for a new world
const WORLD_AHEAD = 60; // generate this many units before the player
const PIXEL_RATIO_LIMIT = 2; // more pixels than this buy nothing on any screen

// Scoring.
const STOMP_SCORE = 100;
const ENEMY_KILL_SCORE = 50;

const GAME_OVER_TEXT = "Game over - press R for a new world";
const WEBGL_READY_TEXT = "WebGL ready";
const WEBGL_BROKEN_TEXT = "This browser cannot render WebGL.";

const canvas = document.getElementById("game");
const hud = findHudElements();

let renderer;
let world;
let player;
let camera;
let view;
let threats;
let run = { lives: START_LIVES, score: 0, stomps: 0, bombsDropped: 0, farthest: 0 };
let time = 0;
let accumulator = 0;
let lastFrame = 0;
let lastQuads = 0;
let gameOver = false;
let textureInfo = []; // name and source of every texture the renderer has
let moonOffset = 0; // lets the checks start the moon arc at a chosen moment

const keyboard = createKeyboard(() => newGame(randomSeed()));

/** Start (or restart) a run with a given seed. */
function newGame(seed) {
  world = createWorld(seed);
  player = createPlayer(world.spawn.x, world.spawn.y);
  camera = createCamera(world.spawn.x + START_CAMERA_LEAD_X, world.spawn.y + CAMERA_LEAD_Y);
  threats = createThreats(seed);
  run = { lives: START_LIVES, score: 0, stomps: 0, bombsDropped: 0, farthest: 0 };
  gameOver = false;
  hud.overlay.classList.add("hidden");
  updateHud(hud, run, world, threats);
}

/** Put the player back at the spawn point after a fall or a hit. */
function respawn() {
  run.lives -= 1;
  player.x = world.spawn.x;
  player.y = world.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  camera.x = world.spawn.x + CAMERA_LEAD_X;
  camera.y = world.spawn.y + CAMERA_LEAD_Y;

  if (run.lives <= 0) {
    gameOver = true;
    showOverlay(hud, GAME_OVER_TEXT);
  }
  updateHud(hud, run, world, threats);
}

/** Advance the simulation by dt seconds. */
function update(dt) {
  time += dt;

  // The world is generated lazily as the player moves to the right.
  ensureWorld(world, player.x + WORLD_AHEAD);

  const input = keyboard.readInput();
  stepPlayer(player, world.platforms, dt, input);

  for (const enemy of world.enemies) stepEnemy(enemy, dt);

  const hit = playerEnemyCollision(player, world.enemies);
  if (hit === "stomp") {
    run.stomps += 1;
    run.score += STOMP_SCORE;
  } else if (hit === "hit") {
    respawn();
  }

  // Jets cross the sky and drop bombs; the blast kills enemies and can hit the
  // player, which costs a life just like touching an enemy.
  const events = stepThreats(threats, world, player, dt, time);
  if (events.bombDropped) run.bombsDropped += 1;
  if (events.enemiesKilled) run.score += events.enemiesKilled * ENEMY_KILL_SCORE;
  if (events.playerHit) respawn();

  if (player.y < deathY(world)) respawn();

  run.farthest = Math.max(run.farthest, Math.floor(player.x));
  followCamera(camera, player.x + CAMERA_LEAD_X, player.y + CAMERA_LEAD_Y, dt);
  updateHud(hud, run, world, threats);
}

/** Fit the canvas and the view rectangle to the window size. */
function resize() {
  const scale = Math.min(PIXEL_RATIO_LIMIT, window.devicePixelRatio || 1);
  renderer.resize(window.innerWidth, window.innerHeight, scale);
  view = computeView(canvas.width / canvas.height);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}

/** Draw the current scene with WebGL and return the number of quads sent. */
function renderFrame() {
  lastQuads = renderer.draw({
    cam: camera,
    view,
    world,
    player,
    enemies: world.enemies,
    threats,
    time,
    moonTime: time + moonOffset,
  });
  return lastQuads;
}

/** Animation loop: fixed physics steps, then one draw per frame. */
function loop(now) {
  const frameTime = Math.min(MAX_FRAME_TIME, (now - lastFrame) / 1000);
  lastFrame = now;

  // After a game over the clock stops: the moon and the bombs stay where they
  // are, so a screenshot check of the last frame stays meaningful.
  if (!gameOver) {
    accumulator += frameTime;
    while (accumulator >= PHYSICS_STEP) {
      update(PHYSICS_STEP);
      accumulator -= PHYSICS_STEP;
    }
  }

  renderFrame();
  requestAnimationFrame(loop);
}

/** Download the photo textures and hand them to the renderer. */
function loadTextureSet() {
  loadTextures().then((textures) => {
    renderer.setTextures(textures);
    textureInfo = textures.map((texture) => ({ name: texture.name, source: texture.source, credit: texture.credit }));
    reportTextures(hud, textures);
  });
}

/** Read the seed from ?seed=... in the address, otherwise use the default. */
function seedFromUrl() {
  const fromUrl = new URLSearchParams(window.location.search).get("seed");
  return fromUrl ? Number(fromUrl) : START_SEED;
}

/** A fresh seed for a new world started with the R key. */
function randomSeed() {
  return (Math.random() * RANDOM_SEED_RANGE) >>> 0;
}

/** Boot the game and report a missing WebGL support in the HUD. */
function start() {
  try {
    renderer = createRenderer(canvas);
    resize();
    newGame(seedFromUrl());
    hud.status.textContent = WEBGL_READY_TEXT;
    loadTextureSet();
    requestAnimationFrame(loop);
  } catch (error) {
    hud.status.textContent = "Error: " + error.message;
    showOverlay(hud, WEBGL_BROKEN_TEXT);
  }
}

window.addEventListener("resize", resize);
start();

// Verification hooks used by the headless browser checks and the console.
installDebugHooks({
  newGame,
  world: () => world,
  player: () => player,
  threats: () => threats,
  camera: () => camera,
  view: () => view,
  canvas: () => canvas,
  gl: () => renderer.gl,
  renderFrame,
  time: () => time,
  moonTime: () => time + moonOffset,
  setMoonPhase: (seconds) => {
    moonOffset = seconds - time;
  },
  textures: () => textureInfo,
  run: () => run,
  quads: () => lastQuads,
});

</script>
