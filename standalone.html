<!doctype html>
<!--
  Purpose: Host the WebGL jump-and-run game: a full-screen canvas plus a small
  HTML HUD that shows score, lives, seed and the controls.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocky Jump &amp; Run - WebGL</title>
    <style>
      :root {
        --panel: rgba(12, 18, 30, 0.72);
        --text: #e8f1f5;
        --accent: #7fd7a6;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #101725;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }

      #game {
        display: block;
        width: 100%;
        height: 100%;
      }

      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px 14px;
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 14px;
        line-height: 1.3;
      }

      #hud b {
        color: var(--accent);
      }

      .alert {
        color: #ff7a5c;
        font-weight: 600;
      }

      #help {
        position: fixed;
        right: 12px;
        top: 12px;
        padding: 8px 12px;
        background: var(--panel);
        color: var(--text);
        border-radius: 10px;
        font-size: 12px;
        max-width: 260px;
      }

      #help kbd {
        background: #2c3a4d;
        border-radius: 4px;
        padding: 2px 6px;
      }

      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 20, 0.55);
        color: var(--text);
        font-size: 22px;
        text-align: center;
      }

      #overlay.hidden {
        display: none;
      }

      #credits {
        position: fixed;
        left: 12px;
        bottom: 10px;
        color: rgba(232, 241, 245, 0.55);
        font-size: 11px;
        max-width: 640px;
      }
    </style>

  <body>
    <canvas id="game" role="img" aria-label="Jump and run game rendered with WebGL"></canvas>

    <div id="hud">
      <span>Score <b id="score">0</b></span>
      <span>Lives <b id="lives">3</b></span>
      <span>Stomped enemies <b id="enemies">0</b></span>
      <span>Distance <b id="distance">0</b></span>
      <span>Bombs <b id="bombs">0</b></span>
      <span id="alert" class="alert"></span>
      <span>Seed <b id="seed">1234</b></span>
      <span id="status">starting…</span>
    </div>

    <div id="help">
      <kbd>A</kbd> / <kbd>D</kbd> run &nbsp; <kbd>Space</kbd> or <kbd>W</kbd> jump &nbsp;
      <kbd>S</kbd> fast-fall &nbsp; <kbd>R</kbd> new world
      <br />
      Jets drop bombs: leave the flashing marker before it hits.
    </div>

    <div id="overlay" class="hidden"></div>

    <div id="credits" aria-label="Texture credits"></div>

    <script>
/* ---- src/prng.js ---- */
// Purpose: Provide a deterministic, seedable pseudo-random generator so the
// procedural world is reproducible: the same seed always builds the same level.

/**
 * Create a seeded random generator (mulberry32).
 * Returns a function that yields floats in [0, 1).
 */
function makeRng(seed) {
  let a = seed >>> 0;
  return function next() {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Return a random float in [min, max). */
function range(rng, min, max) {
  return min + rng() * (max - min);
}

/** Return a random integer in [min, max] inclusive. */
function int(rng, min, max) {
  return Math.floor(min + rng() * (max - min + 1));
}

/** Return one random element from an array. */
function pick(rng, items) {
  return items[Math.floor(rng() * items.length)];
}

/** Keep a number inside [min, max]. */
function clamp(value, min, max) {
  return value < min ? min : value > max ? max : value;
}

/**
 * Return a deterministic float in [0, 1) from two integers.
 * Used for detail patterns (bricks, windows) without storing extra data.
 */
function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 2246822519) >>> 0;
  return ((h ^ (h >>> 13)) >>> 0) / 4294967296;
}

/* ---- src/world.js ---- */
// Purpose: Generate the jump-and-run world procedurally in chunks (platforms,
// patrolling enemies, scenery and a parallax city skyline) so the level grows
// endlessly to the right and is reproducible from one seed.
// Every generation value is a named constant here; the reason for each value is
// written down in agent-memory/design-guidelines/world-generation.md.
// Pure data in, data out, so the generator is testable without a browser.



// Shape of the level. Tests import the first three.
const MIN_PLATFORM_WIDTH = 3.2;
const MAX_GAP = 3.4; // gap before a flat step or a drop
const START_TOP = 2; // walkable surface of the first platform
const MAX_PLATFORM_WIDTH = 9;
const MIN_GAP = 1.2;
const MAX_GAP_BEFORE_CLIMB = 2.4; // climbing is harder than jumping across
const MIN_TOP = -6; // clamped so the level never drifts out of view
const MAX_TOP = 18;
const RISE_CHANCE = 0.45; // most steps go up, drops are the exception
const MAX_RISE = 2; // a small upward step is always reachable
const MAX_DROP = 3; // a bigger drop gives the player room to fall
const GROUND_CHANCE = 0.55; // ground is the dominant kind
const GROUND_HEIGHT = 3; // thick, green, walkable
const FLOAT_HEIGHT = 1; // thin, warm planks, reads as a light platform

// The first chunk is placed by hand: a wide safe strip to land on and a tall
// pillar on the left edge that stops the player from running into the void.
const SAFE_STRIP_X = -2;
const SAFE_STRIP_WIDTH = 12;
const SAFE_STRIP_HEIGHT = 2;
const LEFT_PILLAR = { x: -3.5, top: 12, w: 1.5, h: 20 };
const SPAWN_X = 2;
const START_FRONTIER_X = 10; // first platform that is generated, not placed
const INITIAL_WORLD_X = 120; // how much of the level exists from the start

// Scenery. Bushes are listed twice so greenery is the dominant impression.
const DECOR_TYPES = ["bush", "bush", "tree", "flower", "rock", "lamp"];
const DECOR_SIZES = [0.6, 0.9, 1.2];
const DECOR_EDGE_MARGIN = 0.3;
const EXTRA_DECOR_CHANCE = 0.35; // a second prop on the same platform
const DECOR_HEIGHT_FACTORS = { tree: 2.2, lamp: 2.4, bush: 1.2 };

// Enemies. A patrolling enemy needs room, otherwise it always stands in a
// corner and cannot be passed fairly.
const ENEMY_MIN_WIDTH = 4.5;
const ENEMY_CHANCE = 0.5;
const ENEMY_EDGE_MARGIN = 0.4;
const ENEMY_SIZE = 1.2;
const ENEMY_SPEED_MIN = 1.2;
const ENEMY_SPEED_MAX = 3.0;

// Background hills, seen between the city layers.
const HILL_CHANCE = 0.4;
const HILL_BACK = [2, 8]; // hills sit behind the platform they belong to
const HILL_BASE_DROP = 10; // their base stays below the platform top
const HILL_WIDTH = [10, 26];
const HILL_HEIGHT = [5, 12];

// Background city: SKYLINE_FAR_LAYER is the far skyline (generated almost every
// chunk so it reads as one continuous city), SKYLINE_NEAR_LAYER the nearer and
// sparser one. The renderer picks its buildings by these numbers.
const SKYLINE_FAR_LAYER = 0;
const SKYLINE_NEAR_LAYER = 1;

const CITY_LAYERS = [
  { layer: SKYLINE_FAR_LAYER, chance: 0.9, back: [2, 14], baseDrop: 12, width: [5, 16], height: [6, 20] },
  { layer: SKYLINE_NEAR_LAYER, chance: 0.6, back: [1, 9], baseDrop: 8, width: [4, 11], height: [3, 12] },
];

// Falling out of the level must end the run, but the line has to follow the
// generated world so a deep chunk is not instantly lethal.
const DEATH_DROP = 12;

/**
 * Create a new world for a seed.
 * Always starts with a safe ground strip and a wall on the left edge.
 */
function createWorld(seed) {
  const world = {
    seed: seed >>> 0,
    rng: makeRng(seed),
    platforms: [],
    enemies: [],
    decor: [],
    hills: [],
    buildings: [],
    nextX: 0, // right frontier of the generated level
    top: START_TOP, // surface height of the last platform
    lowestTop: START_TOP, // deepest surface seen so far
    spawn: { x: SPAWN_X, y: START_TOP },
  };

  addPlatform(world, SAFE_STRIP_X, START_TOP, SAFE_STRIP_WIDTH, SAFE_STRIP_HEIGHT, "ground");
  addPlatform(world, LEFT_PILLAR.x, LEFT_PILLAR.top, LEFT_PILLAR.w, LEFT_PILLAR.h, "wall");
  world.nextX = START_FRONTIER_X;
  ensureWorld(world, INITIAL_WORLD_X);
  return world;
}

/** Generate chunks until the world covers everything left of `upToX`. */
function ensureWorld(world, upToX) {
  while (world.nextX < upToX) generateChunk(world);
}

/**
 * Add one platform at the right frontier of the world, plus optional
 * decoration, an enemy, a background hill and city buildings.
 * The order of the random rolls is fixed: the seed must always build the same
 * level, so a value may never be rolled conditionally unless the skip is part
 * of the design (see the enemy check below).
 */
function generateChunk(world) {
  const rng = world.rng;

  // Height change: mostly a small step up, otherwise a bigger drop.
  const delta = rng() < RISE_CHANCE ? int(rng, 0, MAX_RISE) : -int(rng, 0, MAX_DROP);
  const gap = range(rng, MIN_GAP, delta > 0 ? MAX_GAP_BEFORE_CLIMB : MAX_GAP);
  const x = world.nextX + gap;
  const top = clamp(world.top + delta, MIN_TOP, MAX_TOP);
  const w = range(rng, MIN_PLATFORM_WIDTH, MAX_PLATFORM_WIDTH);
  const kind = rng() < GROUND_CHANCE ? "ground" : "float";
  const h = kind === "ground" ? GROUND_HEIGHT : FLOAT_HEIGHT;

  const plat = addPlatform(world, x, top, w, h, kind);
  world.top = top;
  world.lowestTop = Math.min(world.lowestTop, top);
  world.nextX = x + w;

  addDecor(world, plat);
  if (rng() < EXTRA_DECOR_CHANCE) addDecor(world, plat);

  if (w >= ENEMY_MIN_WIDTH && rng() < ENEMY_CHANCE) addEnemy(world, plat);

  if (rng() < HILL_CHANCE) addHill(world, x, top);

  addCity(world, x, top);
}

/**
 * Add a platform box. `top` is the walkable surface height.
 * Returns the created platform object.
 */
function addPlatform(world, x, top, w, h, kind) {
  const plat = { x, y: top - h, w, h, top, kind };
  world.platforms.push(plat);
  return plat;
}

/** Add scenery (bush, tree, flower, rock or street lamp) sitting on a platform. */
function addDecor(world, plat) {
  const rng = world.rng;
  const type = pick(rng, DECOR_TYPES);
  const size = pick(rng, DECOR_SIZES);
  const h = size * (DECOR_HEIGHT_FACTORS[type] ?? 1);

  world.decor.push({
    type,
    x: plat.x + range(rng, DECOR_EDGE_MARGIN, Math.max(DECOR_EDGE_MARGIN, plat.w - size - DECOR_EDGE_MARGIN)),
    y: plat.top,
    w: size,
    h,
  });
}

/** Add an enemy that patrols back and forth on a platform. */
function addEnemy(world, plat) {
  const rng = world.rng;
  const left = plat.x + ENEMY_EDGE_MARGIN;
  const right = plat.x + plat.w - ENEMY_EDGE_MARGIN - ENEMY_SIZE;
  if (right <= left) return;

  world.enemies.push({
    x: range(rng, left, right),
    y: plat.top,
    w: ENEMY_SIZE,
    h: ENEMY_SIZE,
    left,
    right,
    dir: rng() < 0.5 ? -1 : 1,
    speed: range(rng, ENEMY_SPEED_MIN, ENEMY_SPEED_MAX),
    alive: true,
    squash: 0,
  });
}

/** Add a background hill behind the platform that was just generated. */
function addHill(world, x, top) {
  const rng = world.rng;
  world.hills.push({
    x: x - range(rng, ...HILL_BACK),
    y: top - HILL_BASE_DROP,
    w: range(rng, ...HILL_WIDTH),
    h: range(rng, ...HILL_HEIGHT),
  });
}

/**
 * Add city buildings for the parallax background, one roll per layer.
 * The ids are numbered from the first building of this chunk so the window
 * pattern of a tower stays stable for the seed.
 */
function addCity(world, x, top) {
  const rng = world.rng;
  const firstId = world.buildings.length;

  for (const [index, layer] of CITY_LAYERS.entries()) {
    if (rng() >= layer.chance) continue;

    world.buildings.push({
      layer: layer.layer,
      id: firstId + index,
      x: x - range(rng, ...layer.back),
      y: top - layer.baseDrop,
      w: range(rng, ...layer.width),
      h: range(rng, ...layer.height),
    });
  }
}

/** Y below which the player falls to their death. */
function deathY(world) {
  return world.lowestTop - DEATH_DROP;
}

/* ---- src/physics.js ---- */
// Purpose: Run the game physics - player gravity, jumping, platform collision
// and the enemy patrol movement - independent of rendering.
// Every tuning value is a named constant here, so the game feel can be changed
// in one place without touching the maths.

// Core movement tuning.
const GRAVITY = 34; // downward acceleration, world units per second^2
const JUMP_VELOCITY = 12; // starting speed of a full jump
const RUN_SPEED = 8.5; // top horizontal speed while running
const ACCEL = 70; // how fast the player reaches RUN_SPEED
const MAX_FALL = 28; // terminal falling speed
const COYOTE_TIME = 0.1; // seconds a jump is still allowed after leaving a ledge
const JUMP_BUFFER = 0.12; // seconds an early jump key press is remembered

// Smaller tuning details.
const AIR_DRAG = 14; // slows the player down when no key is held
const STOP_VELOCITY = 0.05; // below this the player is considered standing still
const FAST_FALL_ACCEL = 24; // extra downward pull while the down key is held
const SHORT_HOP_FACTOR = 0.4; // jump is cut to this speed when the key is released
const STOMP_BOUNCE_FACTOR = 0.7; // bounce after stomping an enemy, of JUMP_VELOCITY
const STOMP_MIN_FEET_FACTOR = 0.4; // part of the enemy height the feet must be above
const DEFEAT_SQUASH_RATE = 4; // per second: how fast a squashed enemy flattens
const PLAYER_WIDTH = 1.1;
const PLAYER_HEIGHT = 1.5;

// Collision tolerances: without them a box that exactly touches a platform edge
// would be treated as an overlap and the player would catch on every seam.
const SIDE_TOUCH_EPSILON = 1e-4;
const LANDING_EPSILON = 1e-3;

/** Return true when two axis-aligned boxes overlap. */
function intersects(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

/** Create the player box at a spawn position. */
function createPlayer(x, y) {
  return {
    x,
    y,
    w: PLAYER_WIDTH,
    h: PLAYER_HEIGHT,
    vx: 0,
    vy: 0,
    onGround: false,
    coyote: 0,
    jumpBuffer: 0,
    jumps: 0,
    face: 1,
  };
}

/**
 * Advance the player by dt seconds.
 * `input` is { left, right, jump, down } and returns the player object.
 */
function stepPlayer(p, platforms, dt, input) {
  const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);

  if (dir !== 0) {
    p.vx += dir * ACCEL * dt;
    if (p.vx > RUN_SPEED) p.vx = RUN_SPEED;
    if (p.vx < -RUN_SPEED) p.vx = -RUN_SPEED;
    p.face = dir;
  } else {
    p.vx *= Math.max(0, 1 - AIR_DRAG * dt);
    if (Math.abs(p.vx) < STOP_VELOCITY) p.vx = 0;
  }

  // Jump with input buffering and coyote time, and shorter hops when the
  // jump key is released early (variable jump height).
  p.jumpBuffer = input.jump ? JUMP_BUFFER : Math.max(0, p.jumpBuffer - dt);
  p.coyote = p.onGround ? COYOTE_TIME : Math.max(0, p.coyote - dt);

  if (p.jumpBuffer > 0 && (p.onGround || p.coyote > 0)) {
    p.vy = JUMP_VELOCITY;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuffer = 0;
    p.jumps += 1;
  } else if (!input.jump && p.vy > JUMP_VELOCITY * SHORT_HOP_FACTOR) {
    p.vy = JUMP_VELOCITY * SHORT_HOP_FACTOR;
  }

  p.vy = Math.max(p.vy - GRAVITY * dt, -MAX_FALL);

  // Horizontal move, then push out of any platform side we entered.
  p.x += p.vx * dt;
  for (const plat of platforms) {
    if (!intersects(p, plat)) continue;
    if (p.vx > 0) p.x = plat.x - p.w;
    else if (p.vx < 0) p.x = plat.x + plat.w;
  }

  // Vertical move, then land on top of a platform or bump the head.
  const prevBottom = p.y;
  const prevTop = p.y + p.h;
  p.y += p.vy * dt;
  p.onGround = false;

  for (const plat of platforms) {
    if (p.x + p.w <= plat.x + SIDE_TOUCH_EPSILON || p.x >= plat.x + plat.w - SIDE_TOUCH_EPSILON) continue;

    if (p.vy <= 0 && prevBottom >= plat.top - LANDING_EPSILON && p.y < plat.top) {
      p.y = plat.top;
      p.vy = 0;
      p.onGround = true;
    } else if (p.vy > 0 && prevTop <= plat.y + LANDING_EPSILON && p.y + p.h > plat.y) {
      p.y = plat.y - p.h;
      p.vy = 0;
    }
  }

  // The down key makes the player drop faster. It is applied after the move so
  // the extra speed only takes effect in the next step, exactly as before.
  if (input.down && !p.onGround) p.vy -= FAST_FALL_ACCEL * dt;

  return p;
}

/** Move a patrolling enemy, turning around at the edges of its platform. */
function stepEnemy(e, dt) {
  if (!e.alive) {
    e.squash = Math.min(1, e.squash + dt * DEFEAT_SQUASH_RATE);
    return;
  }

  e.x += e.dir * e.speed * dt;
  if (e.x <= e.left) {
    e.x = e.left;
    e.dir = 1;
  }
  if (e.x >= e.right) {
    e.x = e.right;
    e.dir = -1;
  }
}

/**
 * Resolve player vs enemy contact.
 * Returns "stomp" when the player lands on the enemy, "hit" when the player
 * touches it from the side, otherwise null.
 */
function playerEnemyCollision(p, enemies) {
  for (const e of enemies) {
    if (!e.alive) continue;
    if (!intersects(p, e)) continue;

    const feetAboveMiddle = p.y > e.y + e.h * STOMP_MIN_FEET_FACTOR;
    if (p.vy <= 0 && feetAboveMiddle) {
      e.alive = false;
      p.y = e.y + e.h;
      p.vy = JUMP_VELOCITY * STOMP_BOUNCE_FACTOR;
      return "stomp";
    }
    return "hit";
  }
  return null;
}

/* ---- src/camera.js ---- */
// Purpose: Turn the world coordinates of the camera into WebGL clip space
// coordinates, keep the camera smoothly following the player and provide the
// shared "how far below the visible area" helper the background layers use.

const VIEW_HEIGHT = 18; // world units visible vertically

// Default distance of a background base line below the bottom edge of the view.
// Towers and hills are drawn down to this line so they run off the screen
// instead of ending in mid-air.
const OFFSCREEN_MARGIN = 40;

// Damping of the camera follow: a larger value snaps the camera harder.
const CAMERA_SMOOTHING = 6;

// How far the camera looks ahead of the player.
const CAMERA_LEAD_X = 4;
const CAMERA_LEAD_Y = 5;

// A new run starts with a wider lead so the player already sees the next
// platforms when the first frame is drawn.
const START_CAMERA_LEAD_X = 6;

/** Compute the visible world width/height for a given canvas aspect ratio. */
function computeView(aspect, height = VIEW_HEIGHT) {
  return { w: height * aspect, h: height };
}

/** Create a camera centred on the player. */
function createCamera(x, y) {
  return { x, y };
}

/** Move the camera towards a target, with a critically damped follow. */
function followCamera(cam, targetX, targetY, dt) {
  const blend = 1 - Math.exp(-CAMERA_SMOOTHING * dt);
  cam.x += (targetX - cam.x) * blend;
  cam.y += (targetY - cam.y) * blend;
  return cam;
}

/**
 * Convert a world point to WebGL clip space (-1..1) for the given camera
 * and view size. Used by the WebGL renderer for every quad vertex.
 */
function worldToClip(x, y, cam, view) {
  return [((x - cam.x) * 2) / view.w, ((y - cam.y) * 2) / view.h];
}

/** Return true when a box is at least partly inside the camera view. */
function inView(box, cam, view) {
  const left = cam.x - view.w / 2;
  const right = cam.x + view.w / 2;
  const bottom = cam.y - view.h / 2;
  const top = cam.y + view.h / 2;
  return box.x < right && box.x + box.w > left && box.y < top && box.y + box.h > bottom;
}

/**
 * World y that lies `margin` units below the bottom edge of the current view.
 * Background layers use it as their ground line, so every tower reaches past
 * the bottom of the screen for any camera position.
 */
function belowBottom(cam, view, margin = OFFSCREEN_MARGIN) {
  return cam.y - view.h / 2 - margin;
}

/* ---- src/shaders.js ---- */
// Purpose: Hold the shader sources of the two WebGL 1 programs and compile
// them: one program for flat coloured boxes, one for boxes covered by a real
// photo. The values that define how a photo is blended are named here.

// 0 keeps the photo as it is, 1 replaces it by the flat game colour. 0.35 lets
// the photo stay readable while it still matches the palette of the game.
const PHOTO_TINT_AMOUNT = 0.35;

// A textured quad covers its whole square unless the disc mask is switched on.
// With the mask: DISC_EDGE is the radius of the circle in uv space, and the
// edge fades out between DISC_SOFT_EDGE and DISC_EDGE.
const DISC_EDGE = 0.5;
const DISC_SOFT_EDGE = 0.42;

// Flat program: colour and alpha per vertex.
const FLAT_VERTEX_SOURCE = `
attribute vec2 pos;
attribute vec3 color;
attribute float alpha;
varying vec3 vcolor;
varying float valpha;
void main() {
  vcolor = color;
  valpha = alpha;
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

const FLAT_FRAGMENT_SOURCE = `
precision mediump float;
varying vec3 vcolor;
varying float valpha;
void main() {
  gl_FragColor = vec4(vcolor, valpha);
}`;

// Textured program: photo coordinates plus the tint colour of the object.
const TEXTURED_VERTEX_SOURCE = `
attribute vec2 pos;
attribute vec2 uv;
attribute vec3 color;
varying vec2 vuv;
varying vec3 vcolor;
void main() {
  vuv = uv;
  vcolor = color;
  gl_Position = vec4(pos, 0.0, 1.0);
}`;

const TEXTURED_FRAGMENT_SOURCE = `
precision mediump float;
varying vec2 vuv;
varying vec3 vcolor;
uniform sampler2D tex;
uniform float disc;
void main() {
  vec4 photo = texture2D(tex, vuv);
  vec3 color = mix(photo.rgb, vcolor, ${PHOTO_TINT_AMOUNT});
  float mask = 1.0;
  if (disc > 0.5) {
    float d = distance(vuv, vec2(0.5, 0.5));
    mask = smoothstep(${DISC_EDGE}, ${DISC_SOFT_EDGE}, d);
  }
  gl_FragColor = vec4(color, photo.a * mask);
}`;

/**
 * Compile and link one vertex plus fragment pair into a program.
 * A shader failure throws with the compiler log: a silent failure would only
 * show up as a black canvas.
 */
function buildProgram(gl, vertexSource, fragmentSource) {
  const program = gl.createProgram();
  const sources = [
    [vertexSource, gl.VERTEX_SHADER],
    [fragmentSource, gl.FRAGMENT_SHADER],
  ];

  for (const [source, type] of sources) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      throw new Error("Shader compile error: " + gl.getShaderInfoLog(shader));
    }
    gl.attachShader(program, shader);
  }

  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error("Shader link error: " + gl.getProgramInfoLog(program));
  }
  return program;
}

/* ---- src/batch.js ---- */
// Purpose: Collect every box of a frame in two big Float32Array buffers and
// hand each buffer to the GPU with one drawArrays call: a batch for flat
// coloured quads and a batch for quads covered by a photo texture.
// At most one draw call per program per frame, which is what keeps the frame
// time low (see agent-memory/design-guidelines/architecture.md).



// Batch sizes: a frame never needs more than this many boxes; anything past
// the limit is dropped instead of growing the buffer.
const MAX_FLAT_QUADS = 15000;
const MAX_TEXTURE_QUADS = 4000;

const FLAT_FLOATS_PER_VERTEX = 6; // x, y, r, g, b, a
const TEXTURE_FLOATS_PER_VERTEX = 7; // x, y, u, v, r, g, b
const VERTICES_PER_BOX = 6; // two triangles
const FLOAT_BYTES = 4; // one WebGL float

/**
 * Create the two batches and compile the programs that read them.
 * Returns the batching API used by the painter primitives.
 */
function createBatch(gl) {
  const flatProgram = buildProgram(gl, FLAT_VERTEX_SOURCE, FLAT_FRAGMENT_SOURCE);
  const texturedProgram = buildProgram(gl, TEXTURED_VERTEX_SOURCE, TEXTURED_FRAGMENT_SOURCE);

  // Attribute layout of the flat program.
  const flatPos = gl.getAttribLocation(flatProgram, "pos");
  const flatColor = gl.getAttribLocation(flatProgram, "color");
  const flatAlpha = gl.getAttribLocation(flatProgram, "alpha");
  const flatStride = FLAT_FLOATS_PER_VERTEX * FLOAT_BYTES;

  // Attribute layout of the textured program.
  const texPos = gl.getAttribLocation(texturedProgram, "pos");
  const texUv = gl.getAttribLocation(texturedProgram, "uv");
  const texColor = gl.getAttribLocation(texturedProgram, "color");
  const texSampler = gl.getUniformLocation(texturedProgram, "tex");
  const texDisc = gl.getUniformLocation(texturedProgram, "disc");
  const texStride = TEXTURE_FLOATS_PER_VERTEX * FLOAT_BYTES;

  // Overlapping quads (glow, clouds, the moon) blend instead of hiding each
  // other, so a translucent box may sit on top of another one.
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const flatBuffer = gl.createBuffer();
  const texBuffer = gl.createBuffer();
  const flatData = new Float32Array(MAX_FLAT_QUADS * VERTICES_PER_BOX * FLAT_FLOATS_PER_VERTEX);
  const texData = new Float32Array(MAX_TEXTURE_QUADS * VERTICES_PER_BOX * TEXTURE_FLOATS_PER_VERTEX);

  const textures = new Map(); // texture name -> WebGL texture
  let textureName = null; // photo of the textured batch being collected
  let discMask = false; // the current textured batch is a round disc

  let flatQuads = 0;
  let flatCount = 0; // floats written into flatData
  let texQuads = 0;
  let texCount = 0; // floats written into texData
  let drawnQuads = 0; // quads actually sent to the GPU this frame

  /** Append one flat box as two triangles; top and bottom may differ in colour. */
  function addFlatQuad(x1, y1, x2, y2, bottomColor, topColor, alpha = 1) {
    const corners = [
      [x1, y1, bottomColor, alpha],
      [x2, y1, bottomColor, alpha],
      [x1, y2, topColor, alpha],
      [x1, y2, topColor, alpha],
      [x2, y1, bottomColor, alpha],
      [x2, y2, topColor, alpha],
    ];

    for (const [x, y, color, cornerAlpha] of corners) {
      flatData[flatCount++] = x;
      flatData[flatCount++] = y;
      flatData[flatCount++] = color[0];
      flatData[flatCount++] = color[1];
      flatData[flatCount++] = color[2];
      flatData[flatCount++] = cornerAlpha;
    }
    flatQuads += 1;
  }

  /** Append one textured box as two triangles, [x, y, u, v] per vertex. */
  function addTexturedQuad(verts, tintColor) {
    for (const [x, y, u, v] of verts) {
      texData[texCount++] = x;
      texData[texCount++] = y;
      texData[texCount++] = u;
      texData[texCount++] = v;
      texData[texCount++] = tintColor[0];
      texData[texCount++] = tintColor[1];
      texData[texCount++] = tintColor[2];
    }
    texQuads += 1;
  }

  /** Upload and draw the flat quads collected so far. */
  function flushFlat() {
    if (flatQuads === 0) return;

    gl.useProgram(flatProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, flatBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, flatData.subarray(0, flatCount), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(flatPos);
    gl.enableVertexAttribArray(flatColor);
    gl.enableVertexAttribArray(flatAlpha);
    gl.vertexAttribPointer(flatPos, 2, gl.FLOAT, false, flatStride, 0);
    gl.vertexAttribPointer(flatColor, 3, gl.FLOAT, false, flatStride, 2 * FLOAT_BYTES);
    gl.vertexAttribPointer(flatAlpha, 1, gl.FLOAT, false, flatStride, 5 * FLOAT_BYTES);
    gl.drawArrays(gl.TRIANGLES, 0, flatQuads * VERTICES_PER_BOX);

    drawnQuads += flatQuads;
    flatQuads = 0;
    flatCount = 0;
  }

  /** Upload and draw the textured quads that share one photo. */
  function flushTextured() {
    if (texQuads === 0) return;

    gl.useProgram(texturedProgram);
    gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, texData.subarray(0, texCount), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(texPos);
    gl.enableVertexAttribArray(texUv);
    gl.enableVertexAttribArray(texColor);
    gl.vertexAttribPointer(texPos, 2, gl.FLOAT, false, texStride, 0);
    gl.vertexAttribPointer(texUv, 2, gl.FLOAT, false, texStride, 2 * FLOAT_BYTES);
    gl.vertexAttribPointer(texColor, 3, gl.FLOAT, false, texStride, 4 * FLOAT_BYTES);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textures.get(textureName));
    gl.uniform1i(texSampler, 0);
    gl.uniform1f(texDisc, discMask ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, texQuads * VERTICES_PER_BOX);

    drawnQuads += texQuads;
    texQuads = 0;
    texCount = 0;
  }

  /** Forget everything collected so far; called at the start of each frame. */
  function reset() {
    flatQuads = 0;
    flatCount = 0;
    texQuads = 0;
    texCount = 0;
    textureName = null;
    discMask = false;
    drawnQuads = 0;
  }

  /**
   * Switch the textured batch to another photo.
   * A batch can only carry one picture, so the old one is drawn first.
   * Returns false when the picture is not loaded, so the caller can fall back
   * to a flat colour.
   */
  function useTexture(name, asDisc) {
    if (!textures.has(name)) return false;
    if (texQuads >= MAX_TEXTURE_QUADS || (textureName !== null && textureName !== name)) flushTextured();

    textureName = name;
    discMask = asDisc;
    return true;
  }

  return {
    addFlatQuad,
    addTexturedQuad,
    flushFlat,
    flushTextured,
    useTexture,
    reset,
    flatQuads: () => flatQuads,
    textureQuads: () => texQuads,
    drawnQuads: () => drawnQuads,
    hasTexture: (name) => textures.has(name),
    uploadTextures: (list) => uploadTextures(gl, textures, list),
    capacity: () => ({ flat: MAX_FLAT_QUADS, textured: MAX_TEXTURE_QUADS }),
  };
}

/**
 * Upload one RGBA pixel buffer as a tiling WebGL texture and remember it by
 * name. The size is a power of two, which WebGL 1 requires for REPEAT.
 */
function uploadTextures(gl, textures, list) {
  for (const item of list) {
    if (!item.pixels) continue;

    const texture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, item.size, item.size, 0, gl.RGBA, gl.UNSIGNED_BYTE, item.pixels);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

    textures.set(item.name, texture);
  }

  return [...textures.keys()];
}

/* ---- src/painter.js ---- */
// Purpose: Provide the drawing primitives every scene module uses: boxes in
// world or clip space, photo-textured boxes, round discs built from thin strips
// and the full-screen sky gradient. The primitives only fill the two batches of
// batch.js; they never change game state.




// A disc is approximated by a stack of thin boxes. More rows look rounder but
// cost more quads, and a tiny disc would waste rows on nothing.
const CLIP_DISC_ROWS = 24; // discs in clip space (the moon halo)
const WORLD_DISC_ROWS = 9; // discs in world space (explosion fireball)
const MIN_CLIP_DISC_RADIUS = 0.01; // smaller clip-space discs are not worth rows
const MIN_WORLD_DISC_RADIUS = 0.05; // smaller world-space discs are invisible

// Shared mixing colours: every lighter edge is a mix toward WHITE, every seam
// and shadow is a mix toward BLACK.
const WHITE = [1, 1, 1];
const BLACK = [0, 0, 0];

/** Blend two rgb colours: t = 0 keeps the first colour, t = 1 the second. */
function mix(colorA, colorB, t) {
  return [colorA[0] + (colorB[0] - colorA[0]) * t, colorA[1] + (colorB[1] - colorA[1]) * t, colorA[2] + (colorB[2] - colorA[2]) * t];
}

/**
 * Texture coordinates for a world box. `tile` is the number of world units one
 * photo covers. The uv values may only depend on the world position, never on
 * the camera, otherwise the photo slides over the platform whenever the camera
 * moves (for example when the player jumps). World y grows upwards while row 0
 * of the image is at the top, so v is negated.
 */
function textureUV(x, y, w, h, tile) {
  return {
    u1: x / tile,
    v1: -y / tile,
    u2: (x + w) / tile,
    v2: -(y + h) / tile,
  };
}

/**
 * Build the six vertices of one textured box in clip space: [x, y, u, v] per
 * vertex, two triangles covering the box. The positions follow the camera, the
 * uv values follow the world only.
 */
function texturedQuad(x, y, w, h, cam, view, tile) {
  const uv = textureUV(x, y, w, h, tile);

  return [
    [clipX(x, cam, view), clipY(y, cam, view), uv.u1, uv.v1],
    [clipX(x + w, cam, view), clipY(y, cam, view), uv.u2, uv.v1],
    [clipX(x, cam, view), clipY(y + h, cam, view), uv.u1, uv.v2],
    [clipX(x, cam, view), clipY(y + h, cam, view), uv.u1, uv.v2],
    [clipX(x + w, cam, view), clipY(y, cam, view), uv.u2, uv.v1],
    [clipX(x + w, cam, view), clipY(y + h, cam, view), uv.u2, uv.v2],
  ];
}

/** Horizontal clip space position (-1..1) of a world x. */
function clipX(x, cam, view) {
  return ((x - cam.x) * 2) / view.w;
}

/** Vertical clip space position (-1..1) of a world y. */
function clipY(y, cam, view) {
  return ((y - cam.y) * 2) / view.h;
}

/**
 * Create the primitives for one canvas.
 * `batch` collects the quads, `canvas` supplies the aspect ratio that keeps
 * clip-space discs round on a wide screen.
 */
function createPainter(batch, canvas) {
  let view = null; // size of the view that is currently being drawn

  /** Remember the view of the frame; every primitive reads it from here. */
  function beginFrame(frameView) {
    view = frameView;
  }

  /** How much taller a clip-space unit is than a wide one. */
  function aspect() {
    return canvas.width / canvas.height;
  }

  /** Draw a box given in world coordinates, using `cam` for the view transform. */
  function rect(x, y, w, h, color, cam, topColor, alpha = 1) {
    if (batch.flatQuads() >= MAX_FLAT_QUADS) return;
    if (!inView({ x, y, w, h }, cam, view)) return;

    batch.addFlatQuad(clipX(x, cam, view), clipY(y, cam, view), clipX(x + w, cam, view), clipY(y + h, cam, view), color, topColor || color, alpha);
  }

  /** Draw a box directly in clip space (-1..1) for the fixed sky layer. */
  function rectClip(x, y, w, h, color, alpha = 1) {
    if (batch.flatQuads() >= MAX_FLAT_QUADS) return;
    batch.addFlatQuad(x, y, x + w, y + h, color, color, alpha);
  }

  /**
   * Draw a box with a real photo texture. `tile` is the number of world units
   * one photo covers. Returns false when the texture is not loaded, so the
   * caller can fall back to a flat colour.
   */
  function rectTex(x, y, w, h, tint, cam, name, tile) {
    if (batch.flatQuads() >= MAX_FLAT_QUADS) return false;
    if (!inView({ x, y, w, h }, cam, view)) return false;
    if (!batch.useTexture(name, false)) return false;

    // The positions move with the camera, the uv values stay in world space,
    // so the photo never slides when the player jumps.
    batch.addTexturedQuad(texturedQuad(x, y, w, h, cam, view, tile), tint);
    return true;
  }

  /** Draw one photo-textured circle in clip space with a soft edge. */
  function discTex(cx, cy, radius, tint, name) {
    if (!batch.useTexture(name, true)) return;

    // A clip-space square is stretched on a wide screen, so the vertical radius
    // is multiplied by the aspect ratio to keep the disc round on the display.
    const halfY = radius * aspect();
    batch.addTexturedQuad(
      [
        [cx - radius, cy - halfY, 0, 1],
        [cx + radius, cy - halfY, 1, 1],
        [cx - radius, cy + halfY, 0, 0],
        [cx - radius, cy + halfY, 0, 0],
        [cx + radius, cy - halfY, 1, 1],
        [cx + radius, cy + halfY, 1, 0],
      ],
      tint
    );
  }

  /**
   * Approximate a round disc in clip space with a stack of thin boxes. The
   * vertical radius is scaled by the aspect ratio so the disc ends up round.
   */
  function discClip(cx, cy, radius, color, alpha = 1) {
    if (radius <= MIN_CLIP_DISC_RADIUS) return;

    const halfY = radius * aspect();
    const rowHeight = (2 * halfY) / CLIP_DISC_ROWS;

    for (let row = 0; row < CLIP_DISC_ROWS; row++) {
      const dy = -halfY + (row + 0.5) * rowHeight;
      const heightRatio = dy / halfY;
      const halfWidth = radius * Math.sqrt(Math.max(0, 1 - heightRatio * heightRatio));
      rectClip(cx - halfWidth, cy + dy - rowHeight / 2, halfWidth * 2, rowHeight, color, alpha);
    }
  }

  /** Approximate a round disc in world space with a stack of thin boxes. */
  function disc(cx, cy, radius, color, cam) {
    if (radius <= MIN_WORLD_DISC_RADIUS) return;

    const rowHeight = (2 * radius) / WORLD_DISC_ROWS;

    for (let row = 0; row < WORLD_DISC_ROWS; row++) {
      const dy = -radius + (row + 0.5) * rowHeight;
      const heightRatio = dy / radius;
      const halfWidth = radius * Math.sqrt(Math.max(0, 1 - heightRatio * heightRatio));
      rect(cx - halfWidth, cy + dy - rowHeight / 2, halfWidth * 2, rowHeight, color, cam);
    }
  }

  /** Paint the whole screen as one vertical gradient: the sky. */
  function skyGradient(topColor, bottomColor) {
    batch.addFlatQuad(-1, -1, 1, 1, bottomColor, topColor, 1);
  }

  /** World y of the base line a background layer draws down to. */
  function belowView(cam, margin = OFFSCREEN_MARGIN) {
    return belowBottom(cam, view, margin);
  }

  /** Return true when a box is at least partly inside the current view. */
  function isVisible(box, cam) {
    return inView(box, cam, view);
  }

  return {
    beginFrame,
    aspect,
    rect,
    rectClip,
    rectTex,
    disc,
    discClip,
    discTex,
    skyGradient,
    belowView,
    isVisible,
    flushFlat: batch.flushFlat,
    flushTextures: batch.flushTextured,
    hasTexture: batch.hasTexture,
    drawnQuads: batch.drawnQuads,
    reset: batch.reset,
  };
}

/* ---- src/moon.js ---- */
// Purpose: Compute where the moon sits in the sky. It rises on the left in an
// arc, stands still for a moment at the top centre, then sets on the right,
// and starts again. Pure maths, so the path can be tested without a browser.

const MOON_RISE = 10; // seconds to climb from the left horizon to the top
const MOON_HOLD = 3; // seconds the moon stays at the highest point
const MOON_SET = 10; // seconds to sink down to the right horizon
const MOON_CYCLE = MOON_RISE + MOON_HOLD + MOON_SET;

const MOON_RADIUS = 0.1; // half width of the disc in clip space (-1..1)

const HORIZON = -1.1; // clip-space height where the moon is fully off screen
const TOP = 0.72; // clip-space height at the highest point (below the HUD bar)
const LEFT = -1.2; // clip-space x of the rising moon
const RIGHT = 1.2; // clip-space x of the setting moon

/**
 * Position of the moon centre in clip space at a given time.
 * Returns { x, y, altitude, phase } with altitude 0 at the horizon and 1 at the
 * top, so the renderer can dim the moon near the horizon.
 */
function moonPosition(time) {
  const cycle = ((time % MOON_CYCLE) + MOON_CYCLE) % MOON_CYCLE;

  if (cycle < MOON_RISE) {
    // Rising: 2t - t^2 is steep at the start and flattens as it reaches the top.
    const t = cycle / MOON_RISE;
    const altitude = 2 * t - t * t;
    return { x: LEFT + (0 - LEFT) * t, y: HORIZON + (TOP - HORIZON) * altitude, altitude, phase: "rise" };
  }

  if (cycle < MOON_RISE + MOON_HOLD) {
    return { x: 0, y: TOP, altitude: 1, phase: "high" };
  }

  // Setting: mirror image of the rise, so the arc is symmetric.
  const t = (cycle - MOON_RISE - MOON_HOLD) / MOON_SET;
  const altitude = 1 - t * t;
  return { x: RIGHT * t, y: HORIZON + (TOP - HORIZON) * altitude, altitude, phase: "set" };
}

/**
 * Colour of the moon for a given altitude: warm and dim near the horizon,
 * bright and pale when it is high in the sky.
 */
function moonTint(altitude) {
  const t = Math.max(0, Math.min(1, altitude));
  return [0.62 + 0.38 * t, 0.52 + 0.44 * t, 0.42 + 0.52 * t];
}

/* ---- src/drawSky.js ---- */
// Purpose: Draw the fixed sky of the scene: the vertical gradient, the stars,
// the slowly drifting clouds and the moon on its arc. Nothing here moves with
// the camera, which is what makes the sky read as infinitely far away.




// Sky gradient: dark blue at the top, pale near the horizon.
const SKY_TOP_COLOUR = [0.09, 0.14, 0.26];
const SKY_BOTTOM_COLOUR = [0.6, 0.76, 0.84];

// Stars are placed by a fixed formula instead of being stored, so the sky is
// the same in every run and costs no memory.
const STAR_COUNT = 42;
const STAR_STEP_X = 0.049; // horizontal distance between two stars
const STAR_STEP_Y = 0.137; // vertical distance between two stars
const STAR_WRAP_X = 2; // clip space width the star field is repeated over
const STAR_WRAP_Y = 0.85; // clip space height the star field is repeated over
const STAR_BOTTOM = 0.06; // stars start above the horizon, not at its edge
const STAR_SIZE = 0.006; // one star is a tiny square
const STAR_COLOUR = [0.85, 0.9, 0.95];

// Clouds drift with the frame time and wrap around the screen.
const CLOUD_COUNT = 6;
const CLOUD_STEP_X = 0.42; // horizontal distance between two clouds
const CLOUD_STEP_Y = 0.31; // vertical distance between two clouds
const CLOUD_WRAP_X = 2.4; // width of the drift before a cloud starts again
const CLOUD_WRAP_Y = 0.62; // height the cloud band is repeated over
const CLOUD_BOTTOM = 0.16; // lowest cloud in clip space
const CLOUD_LEFT_EDGE = -1.2; // a wrapped cloud enters just outside the screen
const CLOUD_DRIFT_SPEED = 0.012; // clip space per second: barely noticeable
const CLOUD_ALPHA = 0.55; // clouds stay translucent
const CLOUD_HAZE_COLOUR = [0.4, 0.5, 0.6];
const CLOUD_CORE_COLOUR = [0.45, 0.55, 0.65];
const CLOUD_SHADE_COLOUR = [0.38, 0.47, 0.57];

// One cloud is a stack of thin haze strips; the offsets keep them overlapping.
const CLOUD_STRIPS = [
  { x: 0, y: 0, w: 0.42, h: 0.035, colour: CLOUD_HAZE_COLOUR },
  { x: 0.08, y: 0.035, w: 0.24, h: 0.03, colour: CLOUD_CORE_COLOUR },
  { x: 0.05, y: -0.02, w: 0.14, h: 0.02, colour: CLOUD_SHADE_COLOUR },
];

// The moon is a photo disc plus a soft halo that lights the sky around it.
const MOON_HALO_FACTOR = 1.9; // the halo is wider than the disc
const MOON_HALO_LIGHT = 0.3; // how much white is mixed into the halo
const MOON_HALO_ALPHA = 0.16; // halo strength when the moon stands low
const MOON_HALO_GAIN = 0.1; // extra halo strength at full altitude

/** Paint the sky gradient and the stars on top of it. */
function drawSky(painter) {
  painter.skyGradient(SKY_TOP_COLOUR, SKY_BOTTOM_COLOUR);

  for (let star = 0; star < STAR_COUNT; star++) {
    const x = -1 + ((star * STAR_STEP_X) % STAR_WRAP_X);
    const y = STAR_BOTTOM + ((star * STAR_STEP_Y) % STAR_WRAP_Y);
    painter.rectClip(x, y, STAR_SIZE, STAR_SIZE, STAR_COLOUR);
  }
}

/** Draw the thin drifting haze strips. */
function drawClouds(painter, time) {
  for (let cloud = 0; cloud < CLOUD_COUNT; cloud++) {
    const x = ((cloud * CLOUD_STEP_X + time * CLOUD_DRIFT_SPEED) % CLOUD_WRAP_X) + CLOUD_LEFT_EDGE;
    const y = CLOUD_BOTTOM + ((cloud * CLOUD_STEP_Y) % CLOUD_WRAP_Y);

    for (const strip of CLOUD_STRIPS) {
      painter.rectClip(x + strip.x, y + strip.y, strip.w, strip.h, strip.colour, CLOUD_ALPHA);
    }
  }
}

/**
 * Draw the moon: a soft halo plus the photo disc, or a flat disc when the
 * photo is missing. Called before the skyline so towers can hide the moon
 * while it rises and sets.
 */
function drawMoon(painter, time) {
  const moon = moonPosition(time);
  const tint = moonTint(moon.altitude);
  const haloAlpha = MOON_HALO_ALPHA + MOON_HALO_GAIN * moon.altitude;

  painter.discClip(moon.x, moon.y, MOON_RADIUS * MOON_HALO_FACTOR, mix(tint, WHITE, MOON_HALO_LIGHT), haloAlpha);

  if (painter.hasTexture("moon")) {
    painter.discTex(moon.x, moon.y, MOON_RADIUS, tint, "moon");
  } else {
    painter.discClip(moon.x, moon.y, MOON_RADIUS, tint);
  }
}

/* ---- src/drawCity.js ---- */
// Purpose: Draw the city skyline and the hills behind the playable level.
// Each layer is moved by a scaled camera instead of scaled world data, which is
// what makes it read as distance (see design-guidelines/background-parallax.md).





// Parallax factors: the smaller the factor, the slower a layer moves, so the
// eye reads the order as distance. The vertical factors stay smaller than the
// horizontal ones because the player mostly runs sideways: strong vertical
// shifts would make the buildings slide up and down and distract from the
// platforms.
const PARALLAX_FAR_X = 0.22;
const PARALLAX_FAR_Y = 0.12;
const PARALLAX_NEAR_X = 0.48;
const PARALLAX_NEAR_Y = 0.28;

// Distant buildings are hazier and lighter, the ones in front are darker:
// depth is expressed by value, not by blur.
const FAR_BUILDING_COLOUR = [0.24, 0.31, 0.4];
const NEAR_BUILDING_COLOUR = [0.16, 0.21, 0.29];
const FAR_HILL_COLOUR = [0.2, 0.28, 0.36];

// The lighter roof edge that makes a tower look like a lit solid.
const ROOF_EDGE_INSET = 0.08; // the edge does not reach the wall corners
const ROOF_EDGE_WIDTH = 0.84; // of the building width
const ROOF_EDGE_HEIGHT = 0.5;
const ROOF_EDGE_LIGHT = 0.1; // of white mixed into the wall colour

// Window grid. Rows are counted from the roof downwards because the roof is
// the only fixed reference of a tower.
const WINDOW_STEP_X = 1.4; // distance between two window columns
const WINDOW_STEP_Y = 1.7; // distance between two window rows
const WINDOW_WIDTH = 0.7;
const WINDOW_HEIGHT = 0.9;
const WINDOW_SIDE_MARGIN = 0.35; // first window is set in from the wall
const WINDOW_ROOF_GAP = 1.2; // first row sits below the roof
const MAX_WINDOW_ROWS = 16; // a tower is never drawn with more rows
const WINDOW_HASH_COLUMN = 97; // mixes the building id into the window pattern

// Lit windows: the near layer has more light on, and a few windows blink over
// time so the city looks alive.
const LIT_CHANCE_NEAR = 0.6;
const LIT_CHANCE_FAR = 0.3;
const BLINK_HASH_MIN = 0.88; // share of windows that may blink
const BLINK_SPEED = 1.5; // how often the blinking windows swap
const LIT_COLOUR_NEAR = [0.93, 0.78, 0.38];
const LIT_COLOUR_FAR = [0.62, 0.68, 0.55];
const DARK_WINDOW_MIX = 0.3; // unlit windows are darker than the wall

// Roof additions of the near layer only. The two salts keep the mast and the
// wing of one building from appearing together.
const ANTENNA_HASH_SALT = 17;
const ANTENNA_HASH_MIN = 0.6; // building id hash above which a mast appears
const ANTENNA_X_FACTOR = 0.45; // of the building width
const ANTENNA_WIDTH = 0.2;
const ANTENNA_HEIGHT = 1.8;
const ANTENNA_COLOUR = [0.36, 0.42, 0.5];
const SIDE_TOWER_HASH_SALT = 29;
const SIDE_TOWER_HASH_MIN = 0.7; // building id hash above which a wing appears
const SIDE_TOWER_WIDTH = 0.6;
const SIDE_TOWER_HEIGHT = 0.5;
const SIDE_TOWER_HEIGHT_FACTOR = 0.5; // of the building height, measured down
const SIDE_TOWER_COLOUR = [0.3, 0.36, 0.44];

/**
 * Draw the far city layer and the hills in front of it. The hills use the same
 * slow camera as the far towers, so both layers move at one speed.
 */
function drawFarLayer(painter, world, cam, time) {
  const farCam = { x: cam.x * PARALLAX_FAR_X, y: cam.y * PARALLAX_FAR_Y };

  for (const building of world.buildings) {
    if (building.layer === SKYLINE_FAR_LAYER) drawBuilding(painter, building, farCam, false, time);
  }
  for (const hill of world.hills) {
    drawHill(painter, hill, farCam);
  }
}

/** Draw the nearer city layer, which moves faster than the far one. */
function drawNearLayer(painter, world, cam, time) {
  const nearCam = { x: cam.x * PARALLAX_NEAR_X, y: cam.y * PARALLAX_NEAR_Y };

  for (const building of world.buildings) {
    if (building.layer === SKYLINE_NEAR_LAYER) drawBuilding(painter, building, nearCam, true, time);
  }
}

/**
 * Draw one tower. `building.y` is the ground line of its lot, but the tower is
 * drawn down past the bottom of the screen so it never looks cut off in
 * mid-air, whatever the camera does.
 */
function drawBuilding(painter, building, cam, isNear, time) {
  const wallColour = isNear ? NEAR_BUILDING_COLOUR : FAR_BUILDING_COLOUR;
  const roof = building.y + building.h;
  const base = painter.belowView(cam);

  painter.rect(building.x, base, building.w, roof - base, wallColour, cam);
  painter.rect(building.x + building.w * ROOF_EDGE_INSET, roof, building.w * ROOF_EDGE_WIDTH, ROOF_EDGE_HEIGHT, mix(wallColour, WHITE, ROOF_EDGE_LIGHT), cam);

  drawWindows(painter, building, cam, isNear, time, wallColour, roof, base);
  drawRoofAdditions(painter, building, cam, isNear, roof);
}

/** Light the window grid of a tower, counted from the roof downwards. */
function drawWindows(painter, building, cam, isNear, time, wallColour, roof, base) {
  const columns = Math.max(1, Math.floor(building.w / WINDOW_STEP_X));
  // Rows below the view are dropped by the visibility test inside rect(), so
  // drawing the full grid costs nothing.
  const rows = Math.max(1, Math.min(MAX_WINDOW_ROWS, Math.floor((roof - base) / WINDOW_STEP_Y)));
  const litChance = isNear ? LIT_CHANCE_NEAR : LIT_CHANCE_FAR;

  for (let row = 0; row < rows; row++) {
    for (let column = 0; column < columns; column++) {
      const pattern = hash(building.id * WINDOW_HASH_COLUMN + row, column);
      const blinking = pattern > BLINK_HASH_MIN && Math.floor(time * BLINK_SPEED + building.id + row) % 2 === 0;
      const isLit = pattern < litChance || blinking;

      const windowColour = isLit
        ? (isNear ? LIT_COLOUR_NEAR : LIT_COLOUR_FAR)
        : mix(wallColour, BLACK, DARK_WINDOW_MIX);

      painter.rect(
        building.x + WINDOW_SIDE_MARGIN + column * WINDOW_STEP_X,
        roof - WINDOW_ROOF_GAP - row * WINDOW_STEP_Y,
        WINDOW_WIDTH,
        WINDOW_HEIGHT,
        windowColour,
        cam
      );
    }
  }
}

/** Add a mast or a side wing to some of the near towers. */
function drawRoofAdditions(painter, building, cam, isNear, roof) {
  if (!isNear) return;

  if (hash(building.id, ANTENNA_HASH_SALT) > ANTENNA_HASH_MIN) {
    painter.rect(building.x + building.w * ANTENNA_X_FACTOR, roof + ROOF_EDGE_HEIGHT, ANTENNA_WIDTH, ANTENNA_HEIGHT, ANTENNA_COLOUR, cam);
  }
  if (hash(building.id, SIDE_TOWER_HASH_SALT) > SIDE_TOWER_HASH_MIN) {
    painter.rect(
      building.x - SIDE_TOWER_WIDTH,
      roof - building.h * SIDE_TOWER_HEIGHT_FACTOR,
      SIDE_TOWER_WIDTH,
      SIDE_TOWER_HEIGHT,
      SIDE_TOWER_COLOUR,
      cam
    );
  }
}

/** Draw one background hill as a plain block that runs off the screen. */
function drawHill(painter, hill, cam) {
  const base = painter.belowView(cam);
  const peak = hill.y + hill.h * 0.5; // only the lower half of a hill shows
  painter.rect(hill.x, base, hill.w, peak - base, FAR_HILL_COLOUR, cam);
}

/* ---- src/drawLevel.js ---- */
// Purpose: Draw the playable level itself: the ground and floating platforms
// with their brick or plank surface, the walkable top edge, the grass on top of
// ground blocks and the scenery props. A platform shows a real photo when
// textures.js delivered one, otherwise a pattern is computed from its own
// coordinates, which keeps the world data small and the look reproducible.




// The starting wall: a stone pillar with a mortar seam in every block row.
const WALL_BODY_COLOUR = [0.33, 0.36, 0.43];
const WALL_SEAM_COLOUR = [0.26, 0.29, 0.35];
const WALL_SEAM_THICKNESS = 0.12;
const WALL_SEAM_OFFSET = 0.35; // the seam sits inside a row, not on its edge

// Bodies and top surfaces of the two platform kinds: ground is thick and green,
// a floating platform is thin and warm, so the player sees the difference.
const GROUND_BODY_COLOUR = [0.31, 0.4, 0.32];
const GROUND_TOP_COLOUR = [0.41, 0.76, 0.44];
const FLOAT_BODY_COLOUR = [0.55, 0.49, 0.42];
const FLOAT_TOP_COLOUR = [0.86, 0.78, 0.58];

// Photo textures: one brick photo covers three world units; the wood planks are
// smaller because the planks themselves are smaller.
const BRICK_TEXTURE_NAME = "brick";
const WOOD_TEXTURE_NAME = "wood";
const BRICK_TILE = 3; // world units per photo tile
const WOOD_TILE = 2;

// One thin mortar line keeps the brick photo connected to the look of the game
// without hiding the photograph.
const PHOTO_SEAM_LIFT = 0.5; // measured down from the top of the block
const PHOTO_SEAM_THICKNESS = 0.1;
const PHOTO_SEAM_MIX = 0.2; // of black mixed into the body colour

// Fallback brick pattern, used when the photo is missing: mortar lines plus a
// few bricks in a slightly lighter shade.
const BRICK_MORTAR_MIX = 0.22; // of black mixed into the body colour
const BRICK_MODULE = 1; // one brick row is one world unit tall
const BRICK_ROW_SEAM_OFFSET = 0.9; // the seam sits near the top of a row
const BRICK_SEAM_THICKNESS = 0.1;
const BRICK_SEAM_HEIGHT = 0.9;
const BRICK_ROW_OFFSET = 0.5; // every other row is shifted by half a brick
const BRICK_SEAM_EDGE_GUARD = 0.05; // no vertical seam right at the edge
const BRICK_SHADE_CHANCE = 0.28; // share of bricks that get a lighter shade
const BRICK_SHADE_INSET_X = 0.1;
const BRICK_SHADE_INSET_Y = 0.12;
const BRICK_SHADE_WIDTH = 0.8;
const BRICK_SHADE_HEIGHT = 0.72;
const BRICK_SHADE_LIGHT_MIX = 0.07; // of white mixed into the body colour

// The lighter strip along the walkable surface that makes a block look lit.
const TOP_EDGE_HEIGHT = 0.35;

// Grass on the walkable surface.
const GRASS_BLADES_PER_UNIT = 2; // blades per world unit of width
const GRASS_SIDE_MARGIN = 0.2; // the first blade is set in from the edge
const GRASS_STEP = 0.5; // distance between two blades
const GRASS_JITTER = 0.25; // random shift so the blades are not a fence
const GRASS_MIN_HEIGHT = 0.15;
const GRASS_GROWTH = 0.4; // extra height taken by the random part
const GRASS_WIDTH = 0.1;
const GRASS_BLADE_COLOUR = [0.18, 0.44, 0.28];
const GRASS_BLADE_MIX = 0.4; // of the blade colour mixed into the surface

// One world coordinate scaled by this factor seeds every per-brick and
// per-blade decision, so the pattern is stable for a platform.
const COORD_HASH_SCALE = 10;

// Scenery colours. Every prop is decoration only and never part of a collision.
const BUSH_COLOUR = [0.28, 0.58, 0.4];
const BUSH_TOP_COLOUR = [0.4, 0.72, 0.5];
const BUSH_LIGHT_COLOUR = [0.43, 0.76, 0.52];
const BUSH_LEAF_COLOUR = [0.2, 0.44, 0.33];
const BUSH_LEAF_SIZE = 0.14;
const TREE_TRUNK_COLOUR = [0.38, 0.29, 0.22];
const TREE_CANOPY_COLOUR = [0.33, 0.6, 0.43];
const TREE_CANOPY_LIGHT_COLOUR = [0.45, 0.72, 0.52];
const TREE_LEAF_COLOUR = [0.22, 0.45, 0.35];
const TREE_LEAF_SIZE = 0.16;
const FLOWER_STEM_COLOUR = [0.3, 0.55, 0.4];
const FLOWER_HEAD_COLOUR = [0.86, 0.5, 0.6];
const FLOWER_HEAD_TOP_COLOUR = [0.95, 0.66, 0.72];
const FLOWER_CORE_COLOUR = [0.98, 0.86, 0.4];
const ROCK_COLOUR = [0.49, 0.51, 0.55];
const ROCK_TOP_COLOUR = [0.58, 0.6, 0.64];
const ROCK_SHADE_COLOUR = [0.42, 0.44, 0.48];
const LAMP_POLE_COLOUR = [0.3, 0.33, 0.38];
const LAMP_POLE_WIDTH = 0.16;
const LAMP_GLOW_COLOUR = [0.95, 0.85, 0.45];
const LAMP_GLOW_TOP_COLOUR = [1, 0.95, 0.65];
const LAMP_GLOW_WIDTH = 0.76;
const LAMP_GLOW_HEIGHT = 0.5;
const LAMP_GLOW_SIDE_OFFSET = 0.3; // the lamp head hangs over the pole
const LAMP_GLOW_TOP_LIFT = 0.5; // height of the head above the top of the pole
const LAMP_HOUSING_COLOUR = [0.62, 0.56, 0.4];
const LAMP_HOUSING_WIDTH = 1.16;
const LAMP_HOUSING_HEIGHT = 0.4;
const LAMP_HOUSING_SIDE_OFFSET = 0.5;
const LAMP_HOUSING_TOP_LIFT = 0.9; // height of the housing above the top

/**
 * Draw one platform: the photo body when the texture arrived, otherwise the
 * procedural pattern, then the top edge and the grass of walkable ground.
 */
function drawPlatform(painter, platform, cam) {
  if (platform.kind === "wall") {
    drawWall(painter, platform, cam);
    return;
  }

  const isGround = platform.kind === "ground";
  const body = isGround ? GROUND_BODY_COLOUR : FLOAT_BODY_COLOUR;
  const surface = isGround ? GROUND_TOP_COLOUR : FLOAT_TOP_COLOUR;

  // The photo is one textured quad and is flushed right away, so the flat
  // details that follow always end up on top of it.
  const photo = painter.rectTex(
    platform.x,
    platform.y,
    platform.w,
    platform.h,
    body,
    cam,
    isGround ? BRICK_TEXTURE_NAME : WOOD_TEXTURE_NAME,
    isGround ? BRICK_TILE : WOOD_TILE
  );
  painter.flushTextures();

  if (photo) {
    painter.rect(
      platform.x,
      platform.y + platform.h - PHOTO_SEAM_LIFT,
      platform.w,
      PHOTO_SEAM_THICKNESS,
      mix(body, BLACK, PHOTO_SEAM_MIX),
      cam
    );
  } else {
    drawBrickPattern(painter, platform, cam, body);
  }

  painter.rect(platform.x, platform.top - TOP_EDGE_HEIGHT, platform.w, TOP_EDGE_HEIGHT, surface, cam);

  if (isGround) drawGrass(painter, platform, cam, surface);
}

/** Draw the tall stone pillar that stops the player at the left edge. */
function drawWall(painter, platform, cam) {
  painter.rect(platform.x, platform.y, platform.w, platform.h, WALL_BODY_COLOUR, cam);

  for (let row = 0; row < Math.floor(platform.h); row++) {
    painter.rect(platform.x, platform.y + row + WALL_SEAM_OFFSET, platform.w, WALL_SEAM_THICKNESS, WALL_SEAM_COLOUR, cam);
  }
}

/** Mortar lines and a few lighter bricks, all derived from the coordinates. */
function drawBrickPattern(painter, platform, cam, body) {
  const mortar = mix(body, BLACK, BRICK_MORTAR_MIX);
  const columns = Math.floor(platform.w / BRICK_MODULE);
  const rows = Math.floor(platform.h / BRICK_MODULE);

  for (let row = 0; row < rows; row++) {
    const rowY = platform.y + row * BRICK_MODULE;
    painter.rect(platform.x, rowY + BRICK_ROW_SEAM_OFFSET, platform.w, BRICK_SEAM_THICKNESS, mortar, cam);

    const shift = row % 2 === 0 ? 0 : BRICK_ROW_OFFSET;
    for (let column = 0; column <= columns; column++) {
      const seamX = platform.x + column * BRICK_MODULE + shift;
      if (seamX < platform.x + platform.w - BRICK_SEAM_EDGE_GUARD) {
        painter.rect(seamX, rowY, BRICK_SEAM_THICKNESS, BRICK_SEAM_HEIGHT, mortar, cam);
      }
    }

    for (let column = 0; column < columns; column++) {
      const pattern = hash(
        Math.round(platform.x * COORD_HASH_SCALE) + column,
        Math.round(platform.y * COORD_HASH_SCALE) + row
      );
      if (pattern < BRICK_SHADE_CHANCE) {
        painter.rect(
          platform.x + column * BRICK_MODULE + shift + BRICK_SHADE_INSET_X,
          rowY + BRICK_SHADE_INSET_Y,
          BRICK_SHADE_WIDTH,
          BRICK_SHADE_HEIGHT,
          mix(body, WHITE, BRICK_SHADE_LIGHT_MIX),
          cam
        );
      }
    }
  }
}

/** The grass blades standing on the walkable surface of a ground block. */
function drawGrass(painter, platform, cam, surface) {
  const bladeCount = Math.floor(platform.w * GRASS_BLADES_PER_UNIT);
  const bladeColour = mix(surface, GRASS_BLADE_COLOUR, GRASS_BLADE_MIX);

  for (let blade = 0; blade < bladeCount; blade++) {
    const x =
      platform.x + GRASS_SIDE_MARGIN + blade * GRASS_STEP + hash(blade, Math.round(platform.top * COORD_HASH_SCALE)) * GRASS_JITTER;
    if (x > platform.x + platform.w - GRASS_SIDE_MARGIN) break;

    const height = GRASS_MIN_HEIGHT + hash(blade, Math.round(platform.y * COORD_HASH_SCALE)) * GRASS_GROWTH;
    painter.rect(x, platform.top, GRASS_WIDTH, height, bladeColour, cam);
  }
}

/** Draw scenery: bush, tree, flower, rock or street lamp. */
function drawDecor(painter, decor, cam) {
  const { x, y, w, h } = decor;

  if (decor.type === "bush") {
    painter.rect(x, y, w, h, BUSH_COLOUR, cam, BUSH_TOP_COLOUR);
    painter.rect(x + w * 0.18, y + h * 0.6, w * 0.64, h * 0.4, BUSH_LIGHT_COLOUR, cam);
    painter.rect(x + w * 0.1, y + h * 0.15, BUSH_LEAF_SIZE, BUSH_LEAF_SIZE, BUSH_LEAF_COLOUR, cam);
    painter.rect(x + w * 0.6, y + h * 0.35, BUSH_LEAF_SIZE, BUSH_LEAF_SIZE, BUSH_LEAF_COLOUR, cam);
  } else if (decor.type === "tree") {
    painter.rect(x, y, w, h, TREE_TRUNK_COLOUR, cam);
    painter.rect(x - w * 0.6, y + h * 0.55, w * 2.2, h * 0.45, TREE_CANOPY_COLOUR, cam);
    painter.rect(x - w * 0.3, y + h * 0.7, w * 1.2, h * 0.25, TREE_CANOPY_LIGHT_COLOUR, cam);
    painter.rect(x - w * 0.5, y + h * 0.6, TREE_LEAF_SIZE, TREE_LEAF_SIZE, TREE_LEAF_COLOUR, cam);
  } else if (decor.type === "flower") {
    painter.rect(x + w * 0.4, y, w * 0.2, h, FLOWER_STEM_COLOUR, cam);
    painter.rect(x, y + h * 0.55, w, h * 0.45, FLOWER_HEAD_COLOUR, cam, FLOWER_HEAD_TOP_COLOUR);
    painter.rect(x + w * 0.35, y + h * 0.7, w * 0.3, h * 0.2, FLOWER_CORE_COLOUR, cam);
  } else if (decor.type === "rock") {
    painter.rect(x, y, w, h, ROCK_COLOUR, cam, ROCK_TOP_COLOUR);
    painter.rect(x + w * 0.2, y + h * 0.3, w * 0.3, h * 0.3, ROCK_SHADE_COLOUR, cam);
  } else if (decor.type === "lamp") {
    drawStreetLamp(painter, decor, cam);
  }
}

/** A street lamp: the pole, the glowing head and its dark housing. */
function drawStreetLamp(painter, decor, cam) {
  const { x, y, h } = decor;

  painter.rect(x, y, LAMP_POLE_WIDTH, h, LAMP_POLE_COLOUR, cam);
  painter.rect(x - LAMP_GLOW_SIDE_OFFSET, y + h - LAMP_GLOW_TOP_LIFT, LAMP_GLOW_WIDTH, LAMP_GLOW_HEIGHT, LAMP_GLOW_COLOUR, cam, LAMP_GLOW_TOP_COLOUR);
  painter.rect(x - LAMP_HOUSING_SIDE_OFFSET, y + h - LAMP_HOUSING_TOP_LIFT, LAMP_HOUSING_WIDTH, LAMP_HOUSING_HEIGHT, LAMP_HOUSING_COLOUR, cam);
}

/* ---- src/drawActors.js ---- */
// Purpose: Draw the actors of the level: the patrolling enemies and the player.
// Both are built from a few boxes with a lighter top edge, and both animate
// their feet with the frame time so they look like they are walking.

// Enemies: purple blocks with one visible eye and two stepping feet.
const ENEMY_BODY_COLOUR = [0.52, 0.31, 0.66];
const ENEMY_TOP_COLOUR = [0.71, 0.45, 0.82];
const ENEMY_SQUASH_SHRINK = 0.7; // part of the height a fully squashed enemy loses
const ENEMY_SQUASH_HIDE_FACE = 0.9; // from this squash on, face and feet are gone
const ENEMY_EYE_SIZE = 0.3;
const ENEMY_EYE_COLOUR = [0.98, 0.96, 0.9];
const ENEMY_PUPIL_COLOUR = [0.1, 0.1, 0.12];
const ENEMY_PUPIL_SIZE = 0.14;
const ENEMY_PUPIL_INSET = 0.12; // pupil sits in the front corner of the eye
const ENEMY_EYE_HEIGHT_FACTOR = 0.45; // of the enemy height
const ENEMY_EYE_FRONT_MARGIN = 0.45; // measured from the front edge
const ENEMY_EYE_BACK_MARGIN = 0.15; // measured from the back edge
const ENEMY_LEG_COLOUR = [0.34, 0.2, 0.44];
const ENEMY_LEG_WIDTH = 0.25;
const ENEMY_LEG_HEIGHT = 0.2;
const ENEMY_LEG_SIDE_MARGIN = 0.1; // first foot is set in from the edge
const ENEMY_LEG_SWING = 0.25; // how far the feet lift
const ENEMY_STEP_SPEED = 6; // how fast the stepping animation runs

// Player: an orange body, a blue shirt and a face that looks where it runs.
const PLAYER_BODY_COLOUR = [0.92, 0.47, 0.33];
const PLAYER_TOP_COLOUR = [0.99, 0.55, 0.42];
const PLAYER_SHIRT_COLOUR = [0.23, 0.55, 0.86];
const PLAYER_SHIRT_HIGHLIGHT_COLOUR = [0.3, 0.68, 0.95];
const PLAYER_SHIRT_HEIGHT = 0.45;
const PLAYER_SHIRT_HIGHLIGHT_HEIGHT = 0.12;
const PLAYER_SHIRT_INSET = 0.05; // the shirt stops short of the body sides
const PLAYER_EYE_COLOUR = [0.98, 0.97, 0.93];
const PLAYER_EYE_WIDTH = 0.3;
const PLAYER_EYE_HEIGHT = 0.32;
const PLAYER_EYE_LIFT = 0.95; // below the head, in world units
const PLAYER_EYE_FRONT_MARGIN = 0.12;
const PLAYER_EYE_BACK_MARGIN = 0.42;
const PLAYER_PUPIL_COLOUR = [0.12, 0.14, 0.18];
const PLAYER_PUPIL_WIDTH = 0.13;
const PLAYER_PUPIL_HEIGHT = 0.16;
const PLAYER_PUPIL_INSET = 0.12;
const PLAYER_PUPIL_LIFT = 0.85;
const PLAYER_LEG_COLOUR = [0.7, 0.33, 0.25];
const PLAYER_LEG_WIDTH = 0.25;
const PLAYER_LEG_HEIGHT = 0.28;
const PLAYER_LEG_SIDE_MARGIN = 0.1;
const PLAYER_LEG_SWING = 0.28; // how far the stride lifts the feet
const PLAYER_STEP_SPEED = 9; // how fast the running animation runs
const PLAYER_AIRBORNE_LEG_LIFT = 0.1; // feet stay tucked while in the air
const PLAYER_ARM_COLOUR = [0.85, 0.4, 0.3];
const PLAYER_ARM_WIDTH = 0.2;
const PLAYER_ARM_HEIGHT = 0.45;
const PLAYER_ARM_SIDE_OFFSET = 0.2; // the arms stick out beside the body
const PLAYER_ARM_HEIGHT_FACTOR = 0.4; // of the body height

/**
 * Draw one patrolling enemy. A squashed enemy is flattened further every
 * frame until its face and feet disappear.
 */
function drawEnemy(painter, enemy, cam, time) {
  const height = enemy.h * (1 - enemy.squash * ENEMY_SQUASH_SHRINK);
  painter.rect(enemy.x, enemy.y, enemy.w, height, ENEMY_BODY_COLOUR, cam, ENEMY_TOP_COLOUR);

  if (enemy.squash >= ENEMY_SQUASH_HIDE_FACE) return;

  const eyeY = enemy.y + height * ENEMY_EYE_HEIGHT_FACTOR;
  const eyeX = enemy.dir > 0 ? enemy.x + enemy.w - ENEMY_EYE_FRONT_MARGIN : enemy.x + ENEMY_EYE_BACK_MARGIN;
  painter.rect(eyeX, eyeY, ENEMY_EYE_SIZE, ENEMY_EYE_SIZE, ENEMY_EYE_COLOUR, cam);
  painter.rect(eyeX + ENEMY_PUPIL_INSET, eyeY + ENEMY_PUPIL_INSET, ENEMY_PUPIL_SIZE, ENEMY_PUPIL_SIZE, ENEMY_PUPIL_COLOUR, cam);

  const swing = ENEMY_LEG_SWING * Math.abs(Math.sin(time * ENEMY_STEP_SPEED + enemy.x));
  painter.rect(enemy.x + ENEMY_LEG_SIDE_MARGIN, enemy.y - swing * 0.5, ENEMY_LEG_WIDTH, ENEMY_LEG_HEIGHT, ENEMY_LEG_COLOUR, cam);
  painter.rect(enemy.x + enemy.w - ENEMY_LEG_SIDE_MARGIN - ENEMY_LEG_WIDTH, enemy.y - swing * 0.4, ENEMY_LEG_WIDTH, ENEMY_LEG_HEIGHT, ENEMY_LEG_COLOUR, cam);
}

/**
 * Draw the player: body, shirt, face, stepping legs and arms. The legs only
 * swing while the player stands on the ground.
 */
function drawPlayer(painter, player, cam, time) {
  const { x, y, w, h } = player;

  painter.rect(x, y, w, h, PLAYER_BODY_COLOUR, cam, PLAYER_TOP_COLOUR);
  painter.rect(x + PLAYER_SHIRT_INSET, y + h - PLAYER_SHIRT_HEIGHT, w - PLAYER_SHIRT_INSET * 2, PLAYER_SHIRT_HEIGHT, PLAYER_SHIRT_COLOUR, cam);
  painter.rect(x + PLAYER_SHIRT_INSET, y + h - PLAYER_SHIRT_HEIGHT, w - PLAYER_SHIRT_INSET * 2, PLAYER_SHIRT_HIGHLIGHT_HEIGHT, PLAYER_SHIRT_HIGHLIGHT_COLOUR, cam);

  const eyeX = player.face > 0 ? x + PLAYER_EYE_FRONT_MARGIN : x + w - PLAYER_EYE_BACK_MARGIN;
  painter.rect(eyeX, y + h - PLAYER_EYE_LIFT, PLAYER_EYE_WIDTH, PLAYER_EYE_HEIGHT, PLAYER_EYE_COLOUR, cam);
  painter.rect(eyeX + PLAYER_PUPIL_INSET, y + h - PLAYER_PUPIL_LIFT, PLAYER_PUPIL_WIDTH, PLAYER_PUPIL_HEIGHT, PLAYER_PUPIL_COLOUR, cam);

  drawSteppingLegs(painter, player, cam, time);

  const armY = y + h * PLAYER_ARM_HEIGHT_FACTOR;
  painter.rect(x - PLAYER_ARM_SIDE_OFFSET, armY, PLAYER_ARM_WIDTH, PLAYER_ARM_HEIGHT, PLAYER_ARM_COLOUR, cam);
  painter.rect(x + w, armY, PLAYER_ARM_WIDTH, PLAYER_ARM_HEIGHT, PLAYER_ARM_COLOUR, cam);
}

/** Two feet that alternate with the frame time: running or tucked in air. */
function drawSteppingLegs(painter, player, cam, time) {
  const { x, y, w } = player;
  const stride = Math.abs(Math.sin(time * PLAYER_STEP_SPEED)) * PLAYER_LEG_SWING;
  const frontLift = player.onGround ? stride : PLAYER_AIRBORNE_LEG_LIFT;
  const backLift = player.onGround ? PLAYER_LEG_SWING - stride : PLAYER_AIRBORNE_LEG_LIFT;

  painter.rect(x + PLAYER_LEG_SIDE_MARGIN, y - frontLift, PLAYER_LEG_WIDTH, PLAYER_LEG_HEIGHT, PLAYER_LEG_COLOUR, cam);
  painter.rect(x + w - PLAYER_LEG_SIDE_MARGIN - PLAYER_LEG_WIDTH, y - backLift, PLAYER_LEG_WIDTH, PLAYER_LEG_HEIGHT, PLAYER_LEG_COLOUR, cam);
}

/* ---- src/jets.js ---- */
// Purpose: Handle the jet fighters that cross the sky every few seconds and
// drop a bomb over the player - spawning, the drop, the fall and the explosion
// when a bomb hits solid ground. Pure maths, so it can be tested without a
// browser.




const FIRST_JET = 4; // seconds before the first jet appears
const JET_MIN_GAP = 4; // shortest pause between two jets
const JET_MAX_GAP = 8; // longest pause between two jets
const JET_HEIGHT = 9; // flying height above the player
const JET_SPAWN_DISTANCE = 20; // how far off screen a jet enters
const JET_SPEED_MIN = 13; // slowest jet crossing the sky
const JET_SPEED_MAX = 18; // fastest jet crossing the sky
const JET_W = 3.4;
const JET_H = 1.1;
const JET_CULL_DISTANCE = 45; // jets farther away than this are dropped
const BOMB_WARNING = 1.5; // seconds between the drop and the impact
const BOMB_W = 0.55;
const BOMB_H = 0.8;
const DROP_ALIGN_TOLERANCE = 0.9; // how exactly the jet must be over the player
const BLAST_RADIUS = 3.2; // how far the explosion reaches
const BLAST_DURATION = 0.6; // how long the fireball is drawn
const MIN_DROP = 4; // smallest distance a bomb is made to fall
const VOID_MARGIN = 30; // below the deepest top a bomb is lost in the void

// The jet seed is mixed with a large odd prime so the world and the jets do not
// run on the same random stream.
const JET_SEED_MIX = 0x9e3779b9;

/** Create the threat state (jets, bombs, explosions) for one run. */
function createThreats(seed) {
  return {
    rng: makeRng((seed ^ JET_SEED_MIX) >>> 0),
    nextId: 0,
    nextJet: FIRST_JET,
    jets: [],
    bombs: [],
    blasts: [],
  };
}

/**
 * Highest platform surface directly below (x, fromY), or null when there is no
 * ground under that column - then the bomb falls into the void.
 */
function surfaceBelow(world, x, fromY) {
  let best = null;
  for (const plat of world.platforms) {
    if (x < plat.x || x > plat.x + plat.w) continue;
    if (plat.top >= fromY) continue;
    if (best === null || plat.top > best) best = plat.top;
  }
  return best;
}

/**
 * Advance jets, bombs and explosions by dt seconds.
 * Returns events so the caller can react: jetSpawned, bombDropped, exploded,
 * playerHit, enemiesKilled.
 */
function stepThreats(threats, world, player, dt, time) {
  const events = {
    jetSpawned: false,
    bombDropped: false,
    exploded: 0,
    playerHit: false,
    enemiesKilled: 0,
  };

  // A new jet appears every few seconds, from the left or from the right.
  if (time >= threats.nextJet) {
    const dir = threats.rng() < 0.5 ? 1 : -1;
    threats.jets.push({
      id: threats.nextId++,
      x: player.x - dir * JET_SPAWN_DISTANCE,
      y: player.y + JET_HEIGHT,
      dir,
      speed: range(threats.rng, JET_SPEED_MIN, JET_SPEED_MAX),
      w: JET_W,
      h: JET_H,
      dropped: false,
    });
    threats.nextJet = time + range(threats.rng, JET_MIN_GAP, JET_MAX_GAP);
    events.jetSpawned = true;
  }

  for (const jet of threats.jets) {
    jet.x += jet.dir * jet.speed * dt;

    // The bomb is released the moment the jet is exactly above the player, so
    // the player can see it coming and has BOMB_WARNING seconds to escape.
    if (!jet.dropped) {
      const jetCenter = jet.x + jet.w / 2;
      const playerCenter = player.x + player.w / 2;
      if (Math.abs(jetCenter - playerCenter) < DROP_ALIGN_TOLERANCE) {
        const targetY = surfaceBelow(world, jetCenter, jet.y);
        // The fall is measured from the jet, so it may pass through the player
        // or the decor on the way down; only the blast itself is dangerous.
        const drop = targetY === null ? MIN_DROP : jet.y - targetY;
        // Gravity is picked so the bomb reaches the ground after exactly
        // BOMB_WARNING seconds, which keeps the warning window predictable.
        // Very short drops use MIN_DROP so the bomb never floats unnaturally.
        threats.bombs.push({
          id: jet.id,
          x: jetCenter,
          y: jet.y,
          vy: 0,
          g: (2 * Math.max(MIN_DROP, drop)) / (BOMB_WARNING * BOMB_WARNING),
          targetY,
          w: BOMB_W,
          h: BOMB_H,
          droppedAt: time,
        });
        jet.dropped = true;
        events.bombDropped = true;
      }
    }
  }

  // Remove jets that have flown out of the world.
  threats.jets = threats.jets.filter((jet) => Math.abs(jet.x - player.x) < JET_CULL_DISTANCE);

  // Bombs fall straight down and explode on the first solid surface.
  for (const bomb of threats.bombs) {
    bomb.vy -= bomb.g * dt;
    bomb.y += bomb.vy * dt;

    if (bomb.targetY !== null && bomb.y <= bomb.targetY) {
      bomb.y = bomb.targetY;
      explode(threats, world, player, bomb, time, events);
      bomb.dead = true;
    } else if (bomb.y < world.lowestTop - VOID_MARGIN) {
      bomb.dead = true; // fell into the void without a blast
    }
  }
  threats.bombs = threats.bombs.filter((b) => !b.dead);

  // Explosions fade out after BLAST_DURATION seconds.
  threats.blasts = threats.blasts.filter((blast) => time - blast.start < blast.duration);

  return events;
}

/**
 * Create the fireball and damage everything inside the blast radius.
 * Exported so the tests can call it directly.
 */
function explode(threats, world, player, bomb, time, events) {
  threats.blasts.push({
    x: bomb.x,
    y: bomb.targetY,
    start: time,
    radius: BLAST_RADIUS,
    duration: BLAST_DURATION,
  });
  events.exploded += 1;

  const px = player.x + player.w / 2;
  const py = player.y + player.h / 2;
  if (distance(px, py, bomb.x, bomb.y) <= BLAST_RADIUS) events.playerHit = true;

  for (const enemy of world.enemies) {
    if (!enemy.alive) continue;
    if (distance(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, bomb.x, bomb.y) <= BLAST_RADIUS) {
      enemy.alive = false;
      enemy.squash = 1;
      events.enemiesKilled += 1;
    }
  }
}

/** Distance between two points. */
function distance(ax, ay, bx, by) {
  const dx = ax - bx;
  const dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

/* ---- src/drawThreats.js ---- */
// Purpose: Draw the threats that fall from the sky: the jet fighter, the
// falling bomb with its warning markers and the explosion. The jets are drawn
// last so they stay readable in front of the level, and the warning markers
// show exactly where a bomb will hit.





// Jet fighter: a light body, dark wings and a flickering engine flame.
const JET_BODY_COLOUR = [0.8, 0.84, 0.9];
const JET_BODY_LIGHT_MIX = 0.12; // of white mixed into the top edge
const JET_DARK_COLOUR = [0.44, 0.49, 0.57];
const JET_COCKPIT_COLOUR = [0.2, 0.26, 0.34];
const JET_TRAIL_COLOUR = [0.55, 0.62, 0.7];
const JET_TRAIL_HEIGHT = 0.22;
const JET_TRAIL_HEIGHT_FACTOR = 0.35; // of the fuselage height
const JET_TRAIL_BASE = 3; // shortest exhaust trail
const JET_TRAIL_SWING = 2; // extra length added by the animation
const JET_TRAIL_SPEED = 3; // how fast the trail pulses
const JET_NOSE_LENGTH = 0.8;
const JET_NOSE_HEIGHT_FACTOR = 0.4; // of the fuselage height
const JET_NOSE_HEIGHT_OFFSET = 0.3; // measured up from the bottom of the body
const JET_WING_INSET = 0.2; // of the fuselage length
const JET_WING_HEIGHT = 0.55;
const JET_WING_LENGTH_FACTOR = 0.55; // of the fuselage length
const JET_WING_DROP = 0.55; // the wing sits under the fuselage
const JET_TAIL_WIDTH = 0.5;
const JET_TAIL_HEIGHT = 0.75;
const JET_COCKPIT_INSET = 0.6; // of the fuselage length
const JET_COCKPIT_LENGTH_FACTOR = 0.22; // of the fuselage length
const JET_COCKPIT_HEIGHT = 0.32;
const JET_COCKPIT_HEIGHT_FACTOR = 0.5; // of the fuselage height
const JET_FLAME_COLOUR = [0.95, 0.62, 0.3];
const JET_FLAME_BASE = 0.5; // shortest flame
const JET_FLAME_SWING = 0.4; // extra length added by the animation
const JET_FLAME_SPEED = 12; // how fast the flame flickers

// Falling bomb and its warning markers.
const WARNING_BLINK_SPEED = 8; // the markers flash this often per second
const WARNING_LINE_STEP = 0.8; // distance between two dashes of the drop line
const WARNING_LINE_WIDTH = 0.14;
const WARNING_LINE_HEIGHT = 0.4;
const WARNING_LINE_BRIGHT = [0.95, 0.45, 0.35];
const WARNING_LINE_DIM = [0.6, 0.3, 0.28];
const GROUND_MARKER_WIDTH = 2.2;
const GROUND_MARKER_HEIGHT = 0.22;
const GROUND_MARKER_BRIGHT = [0.92, 0.36, 0.3];
const GROUND_MARKER_DIM = [0.66, 0.26, 0.24];
const MARKER_CORE_WIDTH = 0.8;
const MARKER_CORE_HEIGHT = 0.3;
const MARKER_CORE_BRIGHT = [1, 0.55, 0.4];
const MARKER_CORE_DIM = [0.8, 0.4, 0.35];
const BOMB_BODY_COLOUR = [0.32, 0.34, 0.39];
const BOMB_BODY_TOP_COLOUR = [0.5, 0.52, 0.58];
const BOMB_FIN_COLOUR = [0.45, 0.47, 0.52];
const BOMB_FIN_WIDTH = 0.56;
const BOMB_FIN_HEIGHT = 0.28;
const BOMB_LIGHT_WIDTH = 0.2;
const BOMB_LIGHT_HEIGHT = 0.28;
const BOMB_LIGHT_SIDE = 0.1; // the fuse light is centred on the bomb
const BOMB_LIGHT_BRIGHT = [1, 0.7, 0.3];
const BOMB_LIGHT_DIM = [0.5, 0.35, 0.2];

// Explosion: smoke, flame and a hot core, all round and growing.
const BLAST_START_SCALE = 0.4; // size at the moment of the blast
const BLAST_GROWTH = 0.6; // extra size at the end of the blast
const BLAST_LIFT_FACTOR = 0.6; // the fireball centre sits above the ground
const SCORCH_HEIGHT = 0.18; // dark mark on the ground the bomb hit
const SCORCH_COLOUR = [0.2, 0.22, 0.26];
const SMOKE_COLOUR = [0.35, 0.33, 0.32];
const FLAME_COLOUR = [0.92, 0.45, 0.22];
const FLAME_SIZE_FACTOR = 0.72; // of the smoke radius
const CORE_COLOUR = [1, 0.9, 0.55];
const CORE_SIZE_FACTOR = 0.4; // of the smoke radius
const FRAGMENT_COUNT = 6; // pieces thrown to each side
const FRAGMENT_SIZE = 0.25;
const FRAGMENT_SPREAD_BASE = 0.6; // of the blast radius
const FRAGMENT_SPREAD_EXTRA = 0.8; // random part of the throw distance
const FRAGMENT_RISE = 1.2; // fragments drift upwards as the blast ages
const FRAGMENT_RISE_BACK = 1.5; // the pieces behind rise a little further

/** Draw a jet fighter crossing the sky, nose pointed in its travel direction. */
function drawJet(painter, jet, cam, time) {
  const front = jet.dir > 0 ? jet.x + jet.w : jet.x;
  const back = jet.dir > 0 ? jet.x : jet.x + jet.w;

  // Exhaust trail behind the aircraft.
  const trailLength = JET_TRAIL_BASE + JET_TRAIL_SWING * Math.abs(Math.sin(time * JET_TRAIL_SPEED + jet.id));
  const trailX = jet.dir > 0 ? back - trailLength : back;
  painter.rect(trailX, jet.y + jet.h * JET_TRAIL_HEIGHT_FACTOR, trailLength, JET_TRAIL_HEIGHT, JET_TRAIL_COLOUR, cam);

  // Fuselage, nose cone, wing and tail fin.
  painter.rect(jet.x, jet.y, jet.w, jet.h, JET_BODY_COLOUR, cam, mix(JET_BODY_COLOUR, WHITE, JET_BODY_LIGHT_MIX));
  painter.rect(jet.dir > 0 ? front : front - JET_NOSE_LENGTH, jet.y + jet.h * JET_NOSE_HEIGHT_OFFSET, JET_NOSE_LENGTH, jet.h * JET_NOSE_HEIGHT_FACTOR, JET_BODY_COLOUR, cam);
  painter.rect(jet.x + jet.w * JET_WING_INSET, jet.y - JET_WING_DROP, jet.w * JET_WING_LENGTH_FACTOR, JET_WING_HEIGHT, JET_DARK_COLOUR, cam);
  painter.rect(jet.dir > 0 ? back : back - JET_TAIL_WIDTH, jet.y + jet.h, JET_TAIL_WIDTH, JET_TAIL_HEIGHT, JET_DARK_COLOUR, cam);
  painter.rect(jet.x + jet.w * JET_COCKPIT_INSET, jet.y + jet.h * JET_COCKPIT_HEIGHT_FACTOR, jet.w * JET_COCKPIT_LENGTH_FACTOR, JET_COCKPIT_HEIGHT, JET_COCKPIT_COLOUR, cam);

  // Flickering engine flame at the rear.
  const flameLength = JET_FLAME_BASE + JET_FLAME_SWING * Math.abs(Math.sin(time * JET_FLAME_SPEED + jet.id));
  painter.rect(jet.dir > 0 ? back - flameLength : back, jet.y + jet.h * JET_NOSE_HEIGHT_OFFSET, flameLength, jet.h * JET_NOSE_HEIGHT_FACTOR, JET_FLAME_COLOUR, cam);
}

/** Draw a falling bomb, its dashed drop line and the blinking ground marker. */
function drawBomb(painter, bomb, cam, time) {
  // Every other frame the warning flashes, so the player sees it clearly.
  const isBright = Math.floor(time * WARNING_BLINK_SPEED) % 2 === 0;

  if (bomb.targetY !== null) drawBombWarning(painter, bomb, cam, isBright);

  // The bomb itself: dark body, fins and a blinking fuse light.
  painter.rect(bomb.x - bomb.w / 2, bomb.y, bomb.w, bomb.h, BOMB_BODY_COLOUR, cam, BOMB_BODY_TOP_COLOUR);
  painter.rect(bomb.x - BOMB_FIN_WIDTH / 2, bomb.y + bomb.h, BOMB_FIN_WIDTH, BOMB_FIN_HEIGHT, BOMB_FIN_COLOUR, cam);
  const lightY = bomb.y + bomb.h + BOMB_FIN_HEIGHT;
  painter.rect(bomb.x - BOMB_LIGHT_SIDE, lightY, BOMB_LIGHT_WIDTH, BOMB_LIGHT_HEIGHT, isBright ? BOMB_LIGHT_BRIGHT : BOMB_LIGHT_DIM, cam);
}

/** Mark the drop line and the exact spot on the ground that will be hit. */
function drawBombWarning(painter, bomb, cam, isBright) {
  const lineColour = isBright ? WARNING_LINE_BRIGHT : WARNING_LINE_DIM;
  for (let y = bomb.targetY; y < bomb.y; y += WARNING_LINE_STEP) {
    painter.rect(bomb.x - WARNING_LINE_WIDTH / 2, y, WARNING_LINE_WIDTH, WARNING_LINE_HEIGHT, lineColour, cam);
  }

  // Danger marker on the ground: a wide bar with a bright core above it.
  const markerColour = isBright ? GROUND_MARKER_BRIGHT : GROUND_MARKER_DIM;
  painter.rect(bomb.x - GROUND_MARKER_WIDTH / 2, bomb.targetY, GROUND_MARKER_WIDTH, GROUND_MARKER_HEIGHT, markerColour, cam);

  const coreColour = isBright ? MARKER_CORE_BRIGHT : MARKER_CORE_DIM;
