  painter.rect(bomb.x - MARKER_CORE_WIDTH / 2, bomb.targetY + GROUND_MARKER_HEIGHT, MARKER_CORE_WIDTH, MARKER_CORE_HEIGHT, coreColour, cam);
}

/** Draw an explosion: a growing fireball with a bright core and dark smoke. */
function drawBlast(painter, blast, cam, time) {
  const duration = blast.duration || BLAST_DURATION;
  const age = Math.min(1, (time - blast.start) / duration);
  const radius = blast.radius * (BLAST_START_SCALE + BLAST_GROWTH * age);
  const centreY = blast.y + radius * BLAST_LIFT_FACTOR;

  // Scorch mark on the solid ground the bomb hit.
  painter.rect(blast.x - radius, blast.y, radius * 2, SCORCH_HEIGHT, SCORCH_COLOUR, cam);

  painter.disc(blast.x, centreY, radius, SMOKE_COLOUR, cam);
  painter.disc(blast.x, centreY, radius * FLAME_SIZE_FACTOR, FLAME_COLOUR, cam);
  painter.disc(blast.x, centreY, radius * CORE_SIZE_FACTOR, CORE_COLOUR, cam);

  drawBlastFragments(painter, blast, cam, age, radius, centreY);
}

/** Debris thrown to both sides; the hash keeps the scatter stable per blast. */
function drawBlastFragments(painter, blast, cam, age, radius, centreY) {
  for (let piece = 0; piece < FRAGMENT_COUNT; piece++) {
    const spread = radius * (FRAGMENT_SPREAD_BASE + hash(Math.round(blast.x * 10), piece) * FRAGMENT_SPREAD_EXTRA);
    painter.rect(blast.x + spread, centreY + age * FRAGMENT_RISE, FRAGMENT_SIZE, FRAGMENT_SIZE, SMOKE_COLOUR, cam);
    painter.rect(blast.x - spread, centreY + age * FRAGMENT_RISE_BACK, FRAGMENT_SIZE, FRAGMENT_SIZE, SMOKE_COLOUR, cam);
  }
}

/* ---- src/renderer.js ---- */
// Purpose: Draw one frame of the game with WebGL. This module creates the
// context, the two quad batches and the painter, then calls the drawing modules
// in the order that makes the picture correct: sky, skyline, level, actors,
// threats. It never changes the game state, it only reads it.









// belowBottom lives in camera.js and the texture helpers in painter.js. They
// stay reachable from here because that is where the tests look for them.



/**
 * Create the WebGL renderer for a canvas.
 * Returns { resize, draw, setTextures, gl }.
 */
function createRenderer(canvas) {
  const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
  if (!gl) throw new Error("WebGL is not available in this browser.");

  const batch = createBatch(gl);
  const painter = createPainter(batch, canvas);

  /** Set the canvas pixel size to its display size times the device scale. */
  function resize(cssWidth, cssHeight, scale) {
    canvas.width = Math.max(1, Math.round(cssWidth * scale));
    canvas.height = Math.max(1, Math.round(cssHeight * scale));
    // WebGL keeps the viewport from context creation, so update it after
    // changing the canvas size or only a small part of the canvas is drawn.
    gl.viewport(0, 0, canvas.width, canvas.height);
  }

  /** Upload the RGBA pixel buffers of the loaded textures to the GPU. */
  function setTextures(list) {
    return batch.uploadTextures(list);
  }

  /**
   * Render one frame of the scene and return the number of quads sent to the
   * GPU. The drawing order below is the painting order: whatever is drawn last
   * ends up on top.
   */
  function draw(scene) {
    const { cam, view, world, player, enemies, threats, time } = scene;
    const moonTime = scene.moonTime === undefined ? time : scene.moonTime;

    painter.beginFrame(view);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // Fixed sky: gradient, stars and the moon. The moon is drawn before the
    // city so the skyline can hide it while it rises and sets.
    drawSky(painter);
    drawMoon(painter, moonTime);
    painter.flushFlat();
    painter.flushTextures();

    // Background layers, each moved by its own slow camera.
    drawClouds(painter, time);
    drawFarLayer(painter, world, cam, time);
    drawNearLayer(painter, world, cam, time);

    // The skyline sits behind the level, so it must reach the GPU first.
    painter.flushFlat();

    for (const platform of world.platforms) drawPlatform(painter, platform, cam);
    for (const decor of world.decor) drawDecor(painter, decor, cam);

    for (const enemy of enemies) {
      if (painter.isVisible(enemy, cam)) drawEnemy(painter, enemy, cam, time);
    }
    if (player) drawPlayer(painter, player, cam, time);

    // Jets, falling bombs and explosions are drawn last so they sit on top of
    // the level and stay readable against the sky.
    if (threats) {
      for (const jet of threats.jets) drawJet(painter, jet, cam, time);
      for (const bomb of threats.bombs) drawBomb(painter, bomb, cam, time);
      for (const blast of threats.blasts) drawBlast(painter, blast, cam, time);
    }

    painter.flushFlat();
    return painter.drawnQuads();
  }

  return { resize, draw, setTextures, gl };
}

/* ---- src/textures.js ---- */
// Purpose: Load a few real photo textures from the internet (Wikimedia
// Commons) and turn them into square RGBA pixel buffers WebGL can upload. If a
// download fails, a small procedural pattern is generated instead so the game
// still looks good without a network connection.



const TEXTURE_SIZE = 512; // power of two, so WebGL 1 may tile it (REPEAT)

/** The three textures the renderer uses. Kept small on purpose. */
const TEXTURES = [
  {
    name: "moon",
    url: "https://upload.wikimedia.org/wikipedia/commons/0/01/Phase-180.jpg",
    credit: "Moon photo: Jay Tanner, CC BY-SA 3.0 (Wikimedia Commons)",
  },
  {
    name: "brick",
    url: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Surfaces_brick_wall_with_mortar_closeup_view.JPG",
    credit: "Brick wall: Tomwsulcer, CC0 (Wikimedia Commons)",
  },
  {
    name: "wood",
    url: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Wood_planks_-_Preview_%28Amal_Kumar_via_Poly_Haven%29.webp",
    credit: "Wood planks: Amal Kumar via Poly Haven, CC0 (Wikimedia Commons)",
  },
];

/** RGB colour of one pixel of the procedural stand-in pattern. */
function pattern(name, x, y, size) {
  if (name === "brick") {
    const rowH = 32;
    const brickW = 64;
    const row = Math.floor(y / rowH);
    const offset = row % 2 === 0 ? 0 : brickW / 2;
    if (y % rowH < 2 || (x + offset) % brickW < 2) return [135, 135, 128]; // mortar
    const shade =
      (0.85 + 0.3 * hash(Math.floor((x + offset) / brickW), row)) * (0.94 + 0.12 * hash(x, y));
    return [Math.round(140 * shade), Math.round(92 * shade), Math.round(72 * shade)];
  }

  if (name === "wood") {
    const plank = 64;
    const row = Math.floor(y / plank);
    if (y % plank < 2) return [58, 42, 30]; // gap between planks
    const shade = (0.8 + 0.3 * hash(row, 5)) * (0.9 + 0.2 * hash(Math.floor(x / 3), row * 13));
    return [Math.round(150 * shade), Math.round(120 * shade), Math.round(88 * shade)];
  }

  // moon: pale grey rock with a handful of darker craters
  const nx = (x + 0.5) / size;
  const ny = (y + 0.5) / size;
  let shade = 0.78 + 0.12 * hash(Math.floor(x / 6), Math.floor(y / 6));
  for (let i = 0; i < 8; i++) {
    const cx = hash(i, 3);
    const cy = hash(i, 7);
    const r = 0.05 + hash(i, 11) * 0.08;
    const d = Math.sqrt((nx - cx) * (nx - cx) + (ny - cy) * (ny - cy));
    if (d < r) shade -= 0.22 * (1 - d / r);
  }
  return [Math.round(248 * shade), Math.round(250 * shade), Math.round(238 * shade)];
}

/** Build a size x size RGBA buffer for one texture without any network access. */
function fallbackPixels(name, size = TEXTURE_SIZE) {
  const pixels = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const [r, g, b] = pattern(name, x, y, size);
      pixels[i] = r;
      pixels[i + 1] = g;
      pixels[i + 2] = b;
      pixels[i + 3] = 255;
    }
  }
  return pixels;
}

/**
 * Download an image and cut its centre square into a size x size RGBA buffer.
 * Throws when the network or the image decoder is not available.
 */
async function fetchPixels(url, size = TEXTURE_SIZE) {
  const response = await fetch(url);
  if (!response.ok) throw new Error("HTTP " + response.status);

  const blob = await response.blob();
  if (typeof createImageBitmap !== "function") throw new Error("no image decoder");

  const image = await createImageBitmap(blob);
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;

  const ctx = canvas.getContext("2d");
  const side = Math.min(image.width, image.height);
  ctx.drawImage(
    image,
    Math.floor((image.width - side) / 2),
    Math.floor((image.height - side) / 2),
    side,
    side,
    0,
    0,
    size,
    size
  );

  if (typeof image.close === "function") image.close();
  return new Uint8Array(ctx.getImageData(0, 0, size, size).data);
}

/**
 * Load every texture. Each entry carries the pixel buffer plus ok/source so the
 * HUD can tell a real photo from the procedural stand-in.
 */
async function loadTextures() {
  const loaded = [];

  for (const texture of TEXTURES) {
    try {
      loaded.push({ ...texture, ok: true, source: "internet", size: TEXTURE_SIZE, pixels: await fetchPixels(texture.url) });
    } catch (error) {
      loaded.push({
        ...texture,
        ok: false,
        source: "fallback",
        error: error.message,
        size: TEXTURE_SIZE,
        pixels: fallbackPixels(texture.name),
      });
    }
  }

  return loaded;
}

/* ---- src/hud.js ---- */
// Purpose: Write the game numbers into the HTML HUD (score, lives, seed, ...),
// show the bomb warning and the game over overlay, and report which photo
// textures were loaded. index.html defines the elements by id.

const ALERT_TEXT = "Bomb incoming!"; // shown while a bomb is in the air
const CREDIT_SEPARATOR = " · ";

/** Find every HUD element the game writes to. */
function findHudElements() {
  return {
    score: document.getElementById("score"),
    lives: document.getElementById("lives"),
    seed: document.getElementById("seed"),
    enemies: document.getElementById("enemies"),
    distance: document.getElementById("distance"),
    bombs: document.getElementById("bombs"),
    status: document.getElementById("status"),
    alert: document.getElementById("alert"),
    credits: document.getElementById("credits"),
    overlay: document.getElementById("overlay"),
  };
}

/** Show the counters of the current run in the HUD bar. */
function updateHud(hud, run, world, threats) {
  hud.score.textContent = String(run.score);
  hud.lives.textContent = String(Math.max(0, run.lives));
  hud.seed.textContent = String(world.seed);
  hud.enemies.textContent = String(run.stomps);
  hud.distance.textContent = String(run.farthest);
  hud.bombs.textContent = String(run.bombsDropped);
  hud.alert.textContent = threats && threats.bombs.length > 0 ? ALERT_TEXT : "";
}

/** Show a message in the centred overlay, for example "Game over". */
function showOverlay(hud, text) {
  hud.overlay.textContent = text;
  hud.overlay.classList.remove("hidden");
}

/** Report how many photo textures really arrived and who made them. */
function reportTextures(hud, textures) {
  const loaded = textures.filter((texture) => texture.ok).length;
  hud.status.textContent = "WebGL ready - " + loaded + " of " + textures.length + " photo textures";
  hud.credits.textContent = textures.map((texture) => texture.credit).join(CREDIT_SEPARATOR);
}

/* ---- src/input.js ---- */
// Purpose: Keep track of the keys that are pressed, hand the physics the input
// object it expects, and run the key that starts a new world.

const RESTART_KEY = "r"; // starts a run with a fresh random seed

// Keys the page must not react to: without this the player would scroll the
// document while jumping (space) or running (arrow keys).
const GAME_KEYS = [" ", "w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"];

/**
 * Start listening to the keyboard.
 * `onRestart` runs when the restart key is pressed.
 * Returns { readInput } for the game loop.
 */
function createKeyboard(onRestart) {
  const pressed = new Set();

  window.addEventListener("keydown", (event) => {
    const key = event.key.toLowerCase();
    if (key === RESTART_KEY) {
      onRestart();
      return;
    }

    pressed.add(key);
    if (GAME_KEYS.includes(key)) event.preventDefault();
  });

  window.addEventListener("keyup", (event) => pressed.delete(event.key.toLowerCase()));

  return { readInput: () => readInput(pressed) };
}

/** Turn the pressed keys into the input object used by the physics. */
function readInput(pressed) {
  return {
    left: pressed.has("a") || pressed.has("arrowleft"),
    right: pressed.has("d") || pressed.has("arrowright"),
    jump: pressed.has(" ") || pressed.has("w") || pressed.has("arrowup"),
    down: pressed.has("s") || pressed.has("arrowdown"),
  };
}

/* ---- src/debug.js ---- */
// Purpose: Put the running game on window.__game so the headless browser checks
// in tools/verify-browser.mjs (and the developer console) can start a run,
// steer it and read back what is currently on screen.
// The hooks must keep their names and result shapes: every browser check that
// fails costs a whole verification run.



const STOMP_DROP_HEIGHT = 3; // the test player is dropped this far above an enemy
const STOMP_FALL_SPEED = -6; // speed used while dropping onto it
const MIN_RECT_PIXELS = 1; // a pixel read-back may never be smaller than one pixel

/**
 * Install the window.__game object.
 * `api` is the small set of getters main.js offers: newGame, world, player,
 * threats, camera, view, canvas, gl, renderFrame, time, moonTime, setMoonPhase,
 * textures, run and quads.
 */
function installDebugHooks(api) {
  window.__game = {
    newGame: api.newGame,
    /** Camera and view, so checks can prove the player is on screen. */
    camera: api.camera,
    view: api.view,
    /** Drop the player above a live enemy so the stomp rule can be checked. */
    debugStomp: () => dropOntoEnemy(api),
    /** Force a jet to appear on the next physics step. */
    spawnJet: () => launchJet(api),
    /** Where the moon currently is on its arc (clip space, -1..1). */
    moon: () => moonPosition(api.moonTime()),
    /** Start the moon arc at a chosen moment of the cycle. */
    setMoonPhase: (seconds) => {
      api.setMoonPhase(seconds);
      return moonPosition(seconds);
    },
    /** Which textures were really downloaded and which use the stand-in. */
    textures: api.textures,
    /** One platform of the current world, for the pixel checks. */
    platform: (index) => {
      const world = api.world();
      return world ? world.platforms[index] : null;
    },
    readWorldRect: (x, y, w, h) => readWorldRect(api, x, y, w, h),
    state: () => readState(api),
  };
}

/**
 * Read the pixels of a world rectangle straight from the WebGL canvas.
 * Proves that a photo texture stays anchored to the world while the camera
 * moves, which a plain pixel diff of two screenshots cannot show.
 */
function readWorldRect(api, x, y, w, h) {
  const gl = api.gl();
  const canvas = api.canvas();
  const cam = api.camera();
  const view = api.view();

  // Redraw first: after a frame is presented the browser may reuse the
  // framebuffer, so readPixels only reliably sees the geometry just drawn.
  api.renderFrame();

  const left = ((x - cam.x) * 2) / view.w;
  const bottom = ((y - cam.y) * 2) / view.h;
  const right = ((x + w - cam.x) * 2) / view.w;
  const top = ((y + h - cam.y) * 2) / view.h;

  const px = Math.round(((left + 1) / 2) * canvas.width);
  const py = Math.round(((bottom + 1) / 2) * canvas.height);
  const pw = Math.max(MIN_RECT_PIXELS, Math.round(((right - left) / 2) * canvas.width));
  const ph = Math.max(MIN_RECT_PIXELS, Math.round(((top - bottom) / 2) * canvas.height));

  const pixels = new Uint8Array(pw * ph * 4);
  gl.readPixels(px, py, pw, ph, gl.RGBA, gl.UNSIGNED_BYTE, pixels);

  return {
    px,
    py,
    pw,
    ph,
    cam: { x: cam.x, y: cam.y },
    canvasWidth: canvas.width,
    canvasHeight: canvas.height,
    pixels: Array.from(pixels),
  };
}

/** Move the player above a live enemy so the next steps stomp it. */
function dropOntoEnemy(api) {
  const world = api.world();
  const player = api.player();
  if (!world || !player) return null;

  const enemy = world.enemies.find((e) => e.alive);
  if (!enemy) return null;

  player.x = enemy.x;
  player.y = enemy.y + STOMP_DROP_HEIGHT;
  player.vx = 0;
  player.vy = STOMP_FALL_SPEED;
  player.onGround = false;
  return enemy.x;
}

/** Ask the threat logic for a jet right now instead of after a few seconds. */
function launchJet(api) {
  const threats = api.threats();
  if (!threats) return null;

  threats.nextJet = api.time();
  return threats.nextJet;
}

/** Collect the counters and positions the checks compare against. */
function readState(api) {
  const world = api.world();
  const player = api.player();
  const threats = api.threats();
  const run = api.run();

  return {
    seed: world ? world.seed : null,
    time: api.time(),
    moon: moonPosition(api.moonTime()),
    platforms: world ? world.platforms.length : 0,
    enemies: world ? world.enemies.length : 0,
    stomps: run.stomps,
    score: run.score,
    lives: run.lives,
    farthest: run.farthest,
    jets: threats ? threats.jets.length : 0,
    bombsInAir: threats ? threats.bombs.length : 0,
    blasts: threats ? threats.blasts.length : 0,
    // Game seconds between the last drop and its explosion. Measured inside the
    // simulation, so the browser check does not have to poll this clock.
    warningDelay: threats ? threats.lastWarningDelay : null,
    bombsDropped: run.bombsDropped,
    textures: api.textures(),
    player: player ? { x: player.x, y: player.y, vy: player.vy, onGround: player.onGround } : null,
    quads: api.quads(),
    enemiesMoving: world ? world.enemies.filter((e) => e.alive).map((e) => ({ x: e.x, dir: e.dir })) : [],
  };
}

/* ---- src/main.js ---- */
// Purpose: Run the jump-and-run game loop: read keyboard input, advance the
// physics, regenerate the world as the player moves, draw with WebGL and update
// the HUD. This file only connects the modules; all rules live in world.js,
// physics.js, jets.js and moon.js, all drawing in the renderer modules.











// Loop timing.
const PHYSICS_STEP = 1 / 120; // fixed sub-step for stable collisions
const MAX_FRAME_TIME = 0.05; // a longer pause (lag) is not simulated

// Run setup.
const START_LIVES = 3;
const START_SEED = 1234; // seed used when the URL carries none
const RANDOM_SEED_RANGE = 0xffffffff; // full 32 bit span for a new world
const WORLD_AHEAD = 60; // generate this many units before the player
const PIXEL_RATIO_LIMIT = 2; // more pixels than this buy nothing on any screen

// Scoring.
const STOMP_SCORE = 100;
const ENEMY_KILL_SCORE = 50;

const GAME_OVER_TEXT = "Game over - press R for a new world";
const WEBGL_READY_TEXT = "WebGL ready";
const WEBGL_BROKEN_TEXT = "This browser cannot render WebGL.";

const canvas = document.getElementById("game");
const hud = findHudElements();

let renderer;
let world;
let player;
let camera;
let view;
let threats;
let run = { lives: START_LIVES, score: 0, stomps: 0, bombsDropped: 0, farthest: 0 };
let time = 0;
let accumulator = 0;
let lastFrame = 0;
let lastQuads = 0;
let gameOver = false;
let textureInfo = []; // name and source of every texture the renderer has
let moonOffset = 0; // lets the checks start the moon arc at a chosen moment

const keyboard = createKeyboard(() => newGame(randomSeed()));

/** Start (or restart) a run with a given seed. */
function newGame(seed) {
  world = createWorld(seed);
  player = createPlayer(world.spawn.x, world.spawn.y);
  camera = createCamera(world.spawn.x + START_CAMERA_LEAD_X, world.spawn.y + CAMERA_LEAD_Y);
  threats = createThreats(seed);
  run = { lives: START_LIVES, score: 0, stomps: 0, bombsDropped: 0, farthest: 0 };
  gameOver = false;
  hud.overlay.classList.add("hidden");
  updateHud(hud, run, world, threats);
}

/** Put the player back at the spawn point after a fall or a hit. */
function respawn() {
  run.lives -= 1;
  player.x = world.spawn.x;
  player.y = world.spawn.y;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  camera.x = world.spawn.x + CAMERA_LEAD_X;
  camera.y = world.spawn.y + CAMERA_LEAD_Y;

  if (run.lives <= 0) {
    gameOver = true;
    showOverlay(hud, GAME_OVER_TEXT);
  }
  updateHud(hud, run, world, threats);
}

/** Advance the simulation by dt seconds. */
function update(dt) {
  time += dt;

  // The world is generated lazily as the player moves to the right.
  ensureWorld(world, player.x + WORLD_AHEAD);

  const input = keyboard.readInput();
  stepPlayer(player, world.platforms, dt, input);

  for (const enemy of world.enemies) stepEnemy(enemy, dt);

  const hit = playerEnemyCollision(player, world.enemies);
  if (hit === "stomp") {
    run.stomps += 1;
    run.score += STOMP_SCORE;
  } else if (hit === "hit") {
    respawn();
  }

  // Jets cross the sky and drop bombs; the blast kills enemies and can hit the
  // player, which costs a life just like touching an enemy.
  const events = stepThreats(threats, world, player, dt, time);
  if (events.bombDropped) run.bombsDropped += 1;
  if (events.enemiesKilled) run.score += events.enemiesKilled * ENEMY_KILL_SCORE;
  if (events.playerHit) respawn();

  if (player.y < deathY(world)) respawn();

  run.farthest = Math.max(run.farthest, Math.floor(player.x));
  followCamera(camera, player.x + CAMERA_LEAD_X, player.y + CAMERA_LEAD_Y, dt);
  updateHud(hud, run, world, threats);
}

/** Fit the canvas and the view rectangle to the window size. */
function resize() {
  const scale = Math.min(PIXEL_RATIO_LIMIT, window.devicePixelRatio || 1);
  renderer.resize(window.innerWidth, window.innerHeight, scale);
  view = computeView(canvas.width / canvas.height);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
}

/** Draw the current scene with WebGL and return the number of quads sent. */
function renderFrame() {
  lastQuads = renderer.draw({
    cam: camera,
    view,
    world,
    player,
    enemies: world.enemies,
    threats,
    time,
    moonTime: time + moonOffset,
  });
  return lastQuads;
}

/** Animation loop: fixed physics steps, then one draw per frame. */
function loop(now) {
  const frameTime = Math.min(MAX_FRAME_TIME, (now - lastFrame) / 1000);
  lastFrame = now;

  // After a game over the clock stops: the moon and the bombs stay where they
  // are, so a screenshot check of the last frame stays meaningful.
  if (!gameOver) {
    accumulator += frameTime;
    while (accumulator >= PHYSICS_STEP) {
      update(PHYSICS_STEP);
      accumulator -= PHYSICS_STEP;
    }
  }

  renderFrame();
  requestAnimationFrame(loop);
}

/** Download the photo textures and hand them to the renderer. */
function loadTextureSet() {
  loadTextures().then((textures) => {
    renderer.setTextures(textures);
    textureInfo = textures.map((texture) => ({ name: texture.name, source: texture.source, credit: texture.credit }));
    reportTextures(hud, textures);
  });
}

/** Read the seed from ?seed=... in the address, otherwise use the default. */
function seedFromUrl() {
  const fromUrl = new URLSearchParams(window.location.search).get("seed");
  return fromUrl ? Number(fromUrl) : START_SEED;
}

/** A fresh seed for a new world started with the R key. */
function randomSeed() {
  return (Math.random() * RANDOM_SEED_RANGE) >>> 0;
}

/** Boot the game and report a missing WebGL support in the HUD. */
function start() {
  try {
    renderer = createRenderer(canvas);
    resize();
    newGame(seedFromUrl());
    hud.status.textContent = WEBGL_READY_TEXT;
    loadTextureSet();
    requestAnimationFrame(loop);
  } catch (error) {
    hud.status.textContent = "Error: " + error.message;
    showOverlay(hud, WEBGL_BROKEN_TEXT);
  }
}

window.addEventListener("resize", resize);
start();

// Verification hooks used by the headless browser checks and the console.
installDebugHooks({
  newGame,
  world: () => world,
  player: () => player,
  threats: () => threats,
  camera: () => camera,
  view: () => view,
  canvas: () => canvas,
  gl: () => renderer.gl,
  renderFrame,
  time: () => time,
  moonTime: () => time + moonOffset,
  setMoonPhase: (seconds) => {
    moonOffset = seconds - time;
  },
  textures: () => textureInfo,
  run: () => run,
  quads: () => lastQuads,
});
